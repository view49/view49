<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Screenshot Editor</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        body {
            background: #0b0f19;
            color: #e2e8f0;
            font-family: system-ui, -apple-system, sans-serif;
        }

        .glow-border {
            background: linear-gradient(90deg, #ff0000, #3b82f6);
            padding: 2px;
            border-radius: 18px;
        }

        .custom-card { background: #121826; }

        #statusMessage { min-height: 20px; }

        .editor-stage {
            position: relative;
            display: inline-block;
            max-width: 100%;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
        }

        .editor-stage img {
            display: block;
            max-width: 100%;
            height: auto;
        }

        .text-layer {
            position: absolute;
            cursor: move;
            padding: 4px 8px;
            outline: 2px dashed transparent;
            white-space: pre-wrap;
            user-select: none;
            line-height: 1.2;
        }

        .text-layer.selected {
            outline: 2px dashed #ff4d4d;
        }

        .upload-zone {
            border: 2px dashed #334155;
            border-radius: 16px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
        }

        .upload-zone:hover {
            border-color: #ff4d4d;
        }

        .control-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .control-row label {
            font-size: 12px;
            color: #94a3b8;
            width: 70px;
            flex-shrink: 0;
        }
    </style>
</head>

<body class="min-h-screen p-4">

    <div class="glow-border w-full max-w-6xl mx-auto shadow-2xl mb-6">
        <div class="custom-card rounded-2xl p-6 md:p-8">

            <div class="flex justify-between items-center mb-6">
                <span class="bg-red-950/80 text-red-400 border border-red-800/50 text-xs font-bold px-4 py-2 rounded-full">
                    ● Editor Engine 2026
                </span>
                <a href="index.html" class="bg-slate-800 hover:bg-slate-700 text-yellow-400 text-xs font-bold px-3 py-2 rounded-full border border-slate-700 no-underline transition-colors">
                    📺 View49
                </a>
            </div>

            <div class="text-center mb-6">
                <h1 class="text-3xl md:text-5xl font-extrabold text-white mb-3">
                    Screenshot Editor
                </h1>
                <p class="text-slate-400 text-sm max-w-2xl mx-auto">
                    Upload a screenshot, add or edit text, drag it into place,
                    change fonts and sizes — then download the result.
                </p>
            </div>

            <div id="uploadZone" class="upload-zone" onclick="document.getElementById('fileInput').click()">
                <div class="text-3xl mb-2">🖼️</div>
                <p class="text-slate-300 text-sm font-semibold">Click to upload a screenshot</p>
                <p class="text-slate-500 text-xs mt-1">PNG, JPG supported</p>
                <input id="fileInput" type="file" accept="image/*" class="hidden" onchange="handleImageUpload(event)" />
            </div>

            <div id="statusMessage" class="text-center text-xs text-slate-400 mt-3"></div>

        </div>
    </div>

    <div id="editorArea" class="max-w-6xl mx-auto hidden">

        <div class="grid grid-cols-1 lg:grid-cols-[1fr_260px] gap-5">

            <!-- STAGE -->
            <div class="custom-card rounded-2xl p-4 flex justify-center items-start overflow-auto">
                <div id="editorStage" class="editor-stage"></div>
            </div>

            <!-- CONTROLS -->
            <div class="custom-card rounded-2xl p-4 space-y-4">

                <button onclick="addTextLayer()" class="w-full bg-gradient-to-r from-red-600 to-red-500 hover:from-red-700 hover:to-red-600 text-white font-bold px-4 py-2.5 rounded-xl text-sm">
                    ➕ Add Text
                </button>

                <div id="layerControls" class="hidden space-y-3 border-t border-slate-700 pt-4">

                    <div class="control-row">
                        <label>Font</label>
                        <select id="fontFamily" onchange="updateSelectedLayer()" class="flex-1 bg-[#0d1322] border border-slate-700 rounded-lg px-2 py-1.5 text-xs text-white">
                            <option value="system-ui, sans-serif">Default</option>
                            <option value="'Arial', sans-serif">Arial</option>
                            <option value="'Georgia', serif">Georgia</option>
                            <option value="'Courier New', monospace">Courier</option>
                            <option value="'Impact', sans-serif">Impact</option>
                        </select>
                    </div>

                    <div class="control-row">
                        <label>Size</label>
                        <input id="fontSize" type="range" min="10" max="120" value="24" oninput="updateSelectedLayer()" class="flex-1" />
                        <span id="fontSizeLabel" class="text-xs text-slate-400 w-10 text-right">24px</span>
                    </div>

                    <div class="control-row">
                        <label>Color</label>
                        <input id="fontColor" type="color" value="#ffffff" oninput="updateSelectedLayer()" class="w-full h-8 bg-transparent border border-slate-700 rounded-lg cursor-pointer" />
                    </div>

                    <div class="control-row">
                        <label>Bold</label>
                        <input id="fontBold" type="checkbox" onchange="updateSelectedLayer()" class="w-4 h-4" />
                    </div>

                    <div class="control-row">
                        <label>Background</label>
                        <input id="bgColor" type="color" value="#000000" oninput="updateSelectedLayer()" class="w-full h-8 bg-transparent border border-slate-700 rounded-lg cursor-pointer" />
                    </div>

                    <div class="control-row">
                        <label>BG Opacity</label>
                        <input id="bgOpacity" type="range" min="0" max="100" value="0" oninput="updateSelectedLayer()" class="flex-1" />
                    </div>

                    <button onclick="deleteSelectedLayer()" class="w-full bg-slate-800 hover:bg-red-900 border border-slate-700 text-white text-xs font-semibold px-4 py-2 rounded-xl">
                        🗑 Delete This Text
                    </button>

                </div>

                <div class="border-t border-slate-700 pt-4 space-y-2">
                    <button onclick="downloadImage()" class="w-full bg-slate-800 hover:bg-slate-700 border border-slate-700 text-white font-bold px-4 py-2.5 rounded-xl text-sm">
                        ⬇ Download Image
                    </button>
                    <button onclick="resetEditor()" class="w-full bg-slate-800 hover:bg-slate-700 border border-slate-700 text-white text-xs px-4 py-2 rounded-xl">
                        ↺ Start Over
                    </button>
                </div>

            </div>

        </div>
    </div>

<script>

let selectedLayer = null;
let layerCounter = 0;

function handleImageUpload(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function (e) {
        const stage = document.getElementById("editorStage");
        stage.innerHTML = `<img src="${e.target.result}" id="baseImage" />`;

        document.getElementById("editorArea").classList.remove("hidden");
        document.getElementById("statusMessage").innerHTML = '<span class="text-green-400">Image loaded. Click "Add Text" to start editing.</span>';

        stage.onclick = function (evt) {
            if (evt.target === stage || evt.target.id === "baseImage") {
                deselectAll();
            }
        };
    };
    reader.readAsDataURL(file);
}

function addTextLayer() {
    const stage = document.getElementById("editorStage");
    if (!document.getElementById("baseImage")) {
        document.getElementById("statusMessage").innerHTML = '<span class="text-red-400">Please upload an image first.</span>';
        return;
    }

    layerCounter++;
    const layer = document.createElement("div");
    layer.className = "text-layer";
    layer.contentEditable = "true";
    layer.dataset.id = "layer" + layerCounter;
    layer.style.left = "40px";
    layer.style.top = "40px";
    layer.style.fontSize = "24px";
    layer.style.fontFamily = "system-ui, sans-serif";
    layer.style.color = "#ffffff";
    layer.style.fontWeight = "normal";
    layer.style.background = "transparent";
    layer.textContent = "Edit this text";

    makeDraggable(layer);

    layer.addEventListener("mousedown", function () {
        selectLayer(layer);
    });

    layer.addEventListener("touchstart", function () {
        selectLayer(layer);
    });

    stage.appendChild(layer);
    selectLayer(layer);
}

function selectLayer(layer) {
    deselectAll();
    layer.classList.add("selected");
    selectedLayer = layer;

    document.getElementById("layerControls").classList.remove("hidden");
    document.getElementById("fontFamily").value = layer.style.fontFamily || "system-ui, sans-serif";
    document.getElementById("fontSize").value = parseInt(layer.style.fontSize) || 24;
    document.getElementById("fontSizeLabel").textContent = (parseInt(layer.style.fontSize) || 24) + "px";
    document.getElementById("fontColor").value = rgbToHex(layer.style.color) || "#ffffff";
    document.getElementById("fontBold").checked = layer.style.fontWeight === "bold";

    const bg = layer.dataset.bgColor || "#000000";
    document.getElementById("bgColor").value = bg;
    document.getElementById("bgOpacity").value = layer.dataset.bgOpacity || 0;
}

function deselectAll() {
    document.querySelectorAll(".text-layer").forEach(l => l.classList.remove("selected"));
    selectedLayer = null;
    document.getElementById("layerControls").classList.add("hidden");
}

function updateSelectedLayer() {
    if (!selectedLayer) return;

    const font = document.getElementById("fontFamily").value;
    const size = document.getElementById("fontSize").value;
    const color = document.getElementById("fontColor").value;
    const bold = document.getElementById("fontBold").checked;
    const bg = document.getElementById("bgColor").value;
    const opacity = document.getElementById("bgOpacity").value;

    selectedLayer.style.fontFamily = font;
    selectedLayer.style.fontSize = size + "px";
    selectedLayer.style.color = color;
    selectedLayer.style.fontWeight = bold ? "bold" : "normal";

    selectedLayer.dataset.bgColor = bg;
    selectedLayer.dataset.bgOpacity = opacity;
    const alpha = (opacity / 100).toFixed(2);
    selectedLayer.style.background = opacity > 0 ? hexToRgba(bg, alpha) : "transparent";

    document.getElementById("fontSizeLabel").textContent = size + "px";
}

function deleteSelectedLayer() {
    if (!selectedLayer) return;
    selectedLayer.remove();
    selectedLayer = null;
    document.getElementById("layerControls").classList.add("hidden");
}

function makeDraggable(el) {
    let offsetX, offsetY, dragging = false;

    el.addEventListener("mousedown", startDrag);
    el.addEventListener("touchstart", startDrag, { passive: false });

    function startDrag(e) {
        if (document.activeElement === el) return;
        dragging = true;
        const point = e.touches ? e.touches[0] : e;
        const rect = el.getBoundingClientRect();
        offsetX = point.clientX - rect.left;
        offsetY = point.clientY - rect.top;
        e.stopPropagation();
    }

    document.addEventListener("mousemove", onDrag);
    document.addEventListener("touchmove", onDrag, { passive: false });
    document.addEventListener("mouseup", stopDrag);
    document.addEventListener("touchend", stopDrag);

    function onDrag(e) {
        if (!dragging) return;
        e.preventDefault();
        const stage = document.getElementById("editorStage");
        const stageRect = stage.getBoundingClientRect();
        const point = e.touches ? e.touches[0] : e;

        let newLeft = point.clientX - stageRect.left - offsetX;
        let newTop = point.clientY - stageRect.top - offsetY;

        newLeft = Math.max(0, Math.min(newLeft, stageRect.width - el.offsetWidth));
        newTop = Math.max(0, Math.min(newTop, stageRect.height - el.offsetHeight));

        el.style.left = newLeft + "px";
        el.style.top = newTop + "px";
    }

    function stopDrag() {
        dragging = false;
    }
}

function rgbToHex(rgb) {
    if (!rgb || rgb.startsWith("#")) return rgb;
    const match = rgb.match(/\d+/g);
    if (!match) return "#ffffff";
    return "#" + match.slice(0, 3).map(x => parseInt(x).toString(16).padStart(2, "0")).join("");
}

function hexToRgba(hex, alpha) {
    const r = parseInt(hex.slice(1, 3), 16);
    const g = parseInt(hex.slice(3, 5), 16);
    const b = parseInt(hex.slice(5, 7), 16);
    return `rgba(${r}, ${g}, ${b}, ${alpha})`;
}

function downloadImage() {
    deselectAll();
    const stage = document.getElementById("editorStage");
    const status = document.getElementById("statusMessage");

    status.innerHTML = '<span class="text-yellow-400">Preparing image...</span>';

    html2canvas(stage, { useCORS: true, backgroundColor: null, scale: 2 }).then(canvas => {
        const link = document.createElement("a");
        link.download = "edited-screenshot.png";
        link.href = canvas.toDataURL("image/png");
        link.click();
        status.innerHTML = '<span class="text-green-400">Downloaded!</span>';
    }).catch(() => {
        status.innerHTML = '<span class="text-red-400">Couldn\'t generate the image. Please try again.</span>';
    });
}

function resetEditor() {
    document.getElementById("editorStage").innerHTML = "";
    document.getElementById("editorArea").classList.add("hidden");
    document.getElementById("fileInput").value = "";
    document.getElementById("statusMessage").innerHTML = "";
    selectedLayer = null;
}

</script>

</body>
</html>
