<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhoText Style AI Image Editor</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0f0f11; color: #ffffff; height: 100vh; overflow: hidden; }

        /* Header */
        .header { height: 48px; background: #18181b; border-bottom: 1px solid #27272a; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; }
        .header-title { font-size: 13px; font-weight: 600; color: #a1a1aa; display: flex; align-items: center; gap: 8px; }
        .btn-download { background: #2563eb; color: #fff; border: none; padding: 6px 14px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; }
        .btn-download:hover { background: #1d4ed8; }

        .editor-container { display: flex; height: calc(100vh - 48px); }

        /* Left Navigation Bar (Icon Bar) */
        .left-bar { width: 56px; background: #18181b; border-right: 1px solid #27272a; display: flex; flex-direction: column; align-items: center; padding-top: 12px; gap: 18px; }
        .bar-icon { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 9px; color: #71717a; cursor: pointer; width: 100%; transition: 0.2s; }
        .bar-icon i { font-size: 16px; }
        .bar-icon:hover, .bar-icon.active { color: #3b82f6; }

        /* Left Secondary Panel (Detected Text / Layers List) */
        .left-panel { width: 240px; background: #121215; border-right: 1px solid #27272a; display: flex; flex-direction: column; }
        .panel-title { padding: 12px 16px; font-size: 11px; font-weight: 700; text-transform: uppercase; color: #71717a; border-bottom: 1px solid #27272a; }
        .upload-box { padding: 12px; border-bottom: 1px solid #27272a; }
        .upload-btn { width: 100%; padding: 8px; background: #27272a; color: #fff; border: 1px solid #3f3f46; border-radius: 6px; font-size: 12px; font-weight: 500; cursor: pointer; text-align: center; }
        .upload-btn:hover { background: #3f3f46; }
        .layers-list { flex: 1; overflow-y: auto; padding: 8px; }
        .layer-item { padding: 8px 10px; background: #18181b; border: 1px solid #27272a; border-radius: 6px; margin-bottom: 6px; font-size: 12px; color: #d4d4d8; display: flex; justify-content: space-between; align-items: center; }

        /* Center Canvas Viewport */
        .viewport { flex: 1; background: #09090b; display: flex; justify-content: center; align-items: center; position: relative; overflow: auto; padding: 20px; }
        .canvas-container { box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5); border-radius: 4px; }

        /* Right Panel (Style Controls) */
        .right-panel { width: 280px; background: #121215; border-left: 1px solid #27272a; padding: 16px; display: flex; flex-direction: column; gap: 16px; }
        .prop-group { display: flex; flex-direction: column; gap: 6px; }
        .prop-group label { font-size: 11px; font-weight: 600; color: #a1a1aa; }
        .prop-group input, .prop-group select { width: 100%; padding: 8px; background: #18181b; border: 1px solid #27272a; color: #fff; border-radius: 6px; font-size: 12px; }
        .prop-group input[type="color"] { height: 36px; padding: 2px; cursor: pointer; }
        .hint-text { font-size: 11px; color: #52525b; text-align: center; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-title"><i class="fa-solid fa-wand-magic-sparkles" style="color: #3b82f6;"></i> PhoText Studio</div>
        <button class="btn-download" onclick="exportImage()"><i class="fa-solid fa-download"></i> Download</button>
    </div>

    <div class="editor-container">
        <div class="left-bar">
            <div class="bar-icon active"><i class="fa-solid fa-font"></i><span>Text</span></div>
            <div class="bar-icon" onclick="addEraserPatch()"><i class="fa-solid fa-eraser"></i><span>Patch</span></div>
            <div class="bar-icon" onclick="document.getElementById('fileInput').click()"><i class="fa-regular fa-image"></i><span>Upload</span></div>
        </div>

        <div class="left-panel">
            <div class="panel-title">Screenshot Layers</div>
            <div class="upload-box">
                <div class="upload-btn" onclick="document.getElementById('fileInput').click()">Upload Screenshot</div>
                <input type="file" id="fileInput" accept="image/*" style="display:none">
            </div>
            <div class="layers-list" id="layersList">
                <div class="hint-text">Upload an image and double click on canvas to add text layers.</div>
            </div>
        </div>

        <div class="viewport">
            <canvas id="editorCanvas"></canvas>
        </div>

        <div class="right-panel">
            <div class="panel-title">Text Style</div>
            
            <div class="prop-group">
                <label>Text Content</label>
                <input type="text" id="textContent" placeholder="Select text to edit...">
            </div>

            <div class="prop-group">
                <label>Font Family</label>
                <select id="fontFamily">
                    <option value="Arial">Arial</option>
                    <option value="Helvetica">Helvetica</option>
                    <option value="Times New Roman">Times New Roman</option>
                    <option value="Courier New">Courier New</option>
                    <option value="Impact">Impact</option>
                </select>
            </div>

            <div class="prop-group">
                <label>Font Size (px)</label>
                <input type="number" id="fontSize" value="20">
            </div>

            <div class="prop-group">
                <label>Text Color</label>
                <input type="color" id="textColor" value="#ffffff">
            </div>

            <div class="prop-group">
                <label>Background Patch Color</label>
                <input type="color" id="bgColor" value="#ffffff">
            </div>

            <button class="upload-btn" style="background:#ef4444; border:none; margin-top:8px;" onclick="deleteSelected()">Delete Selected Element</button>
        </div>
    </div>

    <script>
        let canvas = new fabric.Canvas('editorCanvas', {
            width: 500,
            height: 650,
            backgroundColor: '#18181b'
        });

        // Handle Image Upload
        document.getElementById('fileInput').addEventListener('change', function(e) {
            let file = e.target.files[0];
            if (!file) return;

            let reader = new FileReader();
            reader.onload = function(f) {
                fabric.Image.fromURL(f.target.result, function(img) {
                    canvas.clear();
                    
                    // Scale image to viewport canvas
                    let scale = Math.min((canvas.width) / img.width, (canvas.height) / img.height);
                    img.scale(scale);
                    
                    canvas.setBackgroundImage(img, canvas.renderAll.bind(canvas), {
                        originX: 'center',
                        originY: 'center',
                        left: canvas.width / 2,
                        top: canvas.height / 2
                    });
                });
            };
            reader.readAsDataURL(file);
        });

        // Add Text Layer on Canvas Double Click
        canvas.on('mouse:dblclick', function(options) {
            let pointer = canvas.getPointer(options.e);
            let text = new fabric.IText('New Text', {
                left: pointer.x,
                top: pointer.y,
                fontFamily: 'Arial',
                fill: '#ffffff',
                fontSize: 22,
                backgroundColor: 'rgba(0,0,0,0)'
            });
            canvas.add(text);
            canvas.setActiveObject(text);
            updateLayersList();
        });

        // Selection Handlers
        canvas.on('selection:created', syncProperties);
        canvas.on('selection:updated', syncProperties);

        function syncProperties() {
            let active = canvas.getActiveObject();
            if (!active) return;

            if (active.type === 'i-text') {
                document.getElementById('textContent').value = active.text;
                document.getElementById('fontSize').value = Math.round(active.fontSize);
                document.getElementById('textColor').value = active.fill;
                document.getElementById('fontFamily').value = active.fontFamily;
            }
        }

        // Live Property Controls
        document.getElementById('textContent').addEventListener('input', function(e) {
            let active = canvas.getActiveObject();
            if (active && active.type === 'i-text') {
                active.set('text', e.target.value);
                canvas.renderAll();
                updateLayersList();
            }
        });

        document.getElementById('fontSize').addEventListener('input', function(e) {
            let active = canvas.getActiveObject();
            if (active) {
                active.set('fontSize', parseInt(e.target.value) || 12);
                canvas.renderAll();
            }
        });

        document.getElementById('textColor').addEventListener('input', function(e) {
            let active = canvas.getActiveObject();
            if (active) {
                active.set('fill', e.target.value);
                canvas.renderAll();
            }
        });

        document.getElementById('fontFamily').addEventListener('change', function(e) {
            let active = canvas.getActiveObject();
            if (active) {
                active.set('fontFamily', e.target.value);
                canvas.renderAll();
            }
        });

        document.getElementById('bgColor').addEventListener('input', function(e) {
            let active = canvas.getActiveObject();
            if (active) {
                active.set('backgroundColor', e.target.value);
                canvas.renderAll();
            }
        });

        // Add Background Cover Patch (To hide existing text)
        function addEraserPatch() {
            let rect = new fabric.Rect({
                left: 100,
                top: 100,
                fill: '#ffffff',
                width: 120,
                height: 30,
                rx: 4,
                ry: 4
            });
            canvas.add(rect);
            canvas.setActiveObject(rect);
        }

        function deleteSelected() {
            let active = canvas.getActiveObject();
            if (active) {
                canvas.remove(active);
                canvas.discardActiveObject();
                canvas.renderAll();
                updateLayersList();
            }
        }

        function updateLayersList() {
            let list = document.getElementById('layersList');
            list.innerHTML = '';
            let objects = canvas.getObjects();
            
            objects.forEach((obj, idx) => {
                if(obj.type === 'i-text') {
                    let div = document.createElement('div');
                    div.className = 'layer-item';
                    div.innerHTML = `<span><i class="fa-solid fa-font"></i> ${obj.text}</span>`;
                    div.onclick = () => { canvas.setActiveObject(obj); canvas.renderAll(); };
                    list.appendChild(div);
                }
            });
        }

        function exportImage() {
            canvas.discardActiveObject();
            canvas.renderAll();
            let dataURL = canvas.toDataURL({ format: 'png', quality: 1 });
            let link = document.createElement('a');
            link.download = 'edited-screenshot.png';
            link.href = dataURL;
            link.click();
        }
    </script>
</body>
</html>
