<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Screenshot Text Editor</title>
    
    <!-- External Libraries CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #121212; color: #ffffff; height: 100vh; overflow: hidden; }
        
        .editor-container { display: flex; height: 100vh; width: 100vw; }
        
        /* Left & Right Panels */
        .panel { width: 300px; background-color: #1a1a1a; border-right: 1px solid #2d2d2d; display: flex; flex-direction: column; z-index: 2; }
        .right-panel { border-right: none; border-left: 1px solid #2d2d2d; }
        
        .panel-header { padding: 15px; background-color: #242424; border-bottom: 1px solid #2d2d2d; font-size: 14px; font-weight: bold; color: #e1e1e1; }
        .upload-section { padding: 15px; }
        
        .btn-primary { width: 100%; padding: 10px; background-color: #3b82f6; color: white; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .btn-primary:hover { background-color: #2563eb; }
        .btn-success { background-color: #10b981; }
        .btn-success:hover { background-color: #059669; }
        .btn-danger { background-color: #ef4444; }
        .btn-danger:hover { background-color: #dc2626; }
        
        /* Left Panel Text List */
        .text-list { flex: 1; overflow-y: auto; padding: 15px; }
        .list-item { margin-bottom: 10px; background: #242424; border: 1px solid #333; border-radius: 6px; padding: 8px; }
        .list-item label { font-size: 11px; color: #888; display: block; margin-bottom: 4px; }
        .list-item input { width: 100%; padding: 8px; background: #1a1a1a; border: 1px solid #444; color: #fff; border-radius: 4px; font-size: 13px; }
        .list-item input:focus { outline: none; border-color: #3b82f6; }
        
        /* Center Canvas Workspace */
        .workspace { flex: 1; background-color: #0d0d0d; display: flex; align-items: center; justify-content: center; position: relative; overflow: auto; }
        .canvas-wrapper { border: 1px solid #333; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        /* Tools Section (Right Panel) */
        .tools-body { padding: 15px; display: flex; flex-direction: column; gap: 15px; flex: 1; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group label { font-size: 12px; color: #aaa; }
        .form-group input, .form-group select { width: 100%; padding: 8px; background: #242424; border: 1px solid #383838; color: white; border-radius: 4px; font-size: 13px; }
        .form-group input[type="color"] { height: 38px; cursor: pointer; padding: 2px; }
        
        /* Loader Overlay */
        .loader { position: absolute; inset: 0; background: rgba(0,0,0,0.8); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10; }
        .spinner { border: 4px solid #333; border-top: 4px solid #3b82f6; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .no-data { text-align: center; color: #666; font-size: 13px; margin-top: 20px; }
    </style>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function App() {
            const [loading, setLoading] = useState(false);
            const [statusText, setStatusText] = useState('');
            const [texts, setTexts] = useState([]);
            const [selectedObj, setSelectedObj] = useState(null);
            
            const canvasRef = useRef(null);
            const fabricCanvas = useRef(null);
            const fileInputRef = useRef(null);

            // Canvas Init
            useEffect(() => {
                fabricCanvas.current = new fabric.Canvas('c', {
                    width: 600,
                    height: 800,
                    backgroundColor: '#1e1e1e'
                });

                const fc = fabricCanvas.current;
                
                fc.on('selection:created', (e) => setSelectedObj(e.selected[0]));
                fc.on('selection:updated', (e) => setSelectedObj(e.selected[0]));
                fc.on('selection:cleared', () => setSelectedObj(null));

                return () => fc.dispose();
            }, []);

            // Image Upload Handler
            const handleUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (evt) => {
                    const imgUrl = evt.target.result;
                    
                    fabric.Image.fromURL(imgUrl, (img) => {
                        const fc = fabricCanvas.current;
                        fc.clear();
                        setTexts([]);

                        // Scale image to fit canvas
                        const scale = Math.min((fc.width - 20) / img.width, (fc.height - 20) / img.height);
                        img.scale(scale);
                        
                        fc.setBackgroundImage(img, fc.renderAll.bind(fc), {
                            top: 10,
                            left: 10
                        });

                        // Start AI Scan
                        scanImage(imgUrl);
                    });
                };
                reader.readAsDataURL(file);
            };

            // OCR Scanning Logic
            const scanImage = async (url) => {
                setLoading(true);
                setStatusText('AI Image Scan ho raha hai...');
                
                try {
                    const worker = await Tesseract.createWorker('eng');
                    const { data: { words } } = await worker.recognize(url);
                    await worker.terminate();

                    const detected = [];
                    words.filter(w => w.confidence > 50).forEach((word, index) => {
                        const textObj = new fabric.IText(word.text, {
                            left: word.bbox.x0 + 10,
                            top: word.bbox.y0 + 10,
                            fontSize: Math.max(14, word.bbox.y1 - word.bbox.y0),
                            fill: '#000000',
                            backgroundColor: 'rgba(255,255,255,0.8)',
                            padding: 2,
                            id: index
                        });

                        fabricCanvas.current.add(textObj);
                        detected.push({ id: index, text: word.text, obj: textObj });
                    });

                    fabricCanvas.current.renderAll();
                    setTexts(detected);
                } catch (err) {
                    alert('Scanning failed. Try again.');
                } finally {
                    setLoading(false);
                }
            };

            // Live Text Update (From Left Panel)
            const handleTextChange = (id, newText) => {
                const item = texts.find(t => t.id === id);
                if (item) {
                    item.obj.set('text', newText);
                    fabricCanvas.current.renderAll();
                    setTexts([...texts]);
                }
            };

            // Update Style Properties (From Right Panel)
            const updateProp = (prop, value) => {
                if (selectedObj) {
                    selectedObj.set(prop, value);
                    fabricCanvas.current.renderAll();
                    
                    // Sync left list if text changed via right panel
                    if (prop === 'text' && selectedObj.id !== undefined) {
                        const item = texts.find(t => t.id === selectedObj.id);
                        if(item) item.text = value;
                        setTexts([...texts]);
                    }
                }
            };

            // Delete Element
            const deleteSelected = () => {
                if (selectedObj) {
                    fabricCanvas.current.remove(selectedObj);
                    setSelectedObj(null);
                }
            };

            // Download Final Output
            const downloadImage = () => {
                fabricCanvas.current.discardActiveObject().renderAll();
                const link = document.createElement('a');
                link.download = 'edited-image.png';
                link.href = fabricCanvas.current.toDataURL({ format: 'png', multiplier: 2 });
                link.click();
            };

            return (
                <div className="editor-container">
                    {/* LEFT PANEL */}
                    <div className="panel">
                        <div className="panel-header">Detected Elements (Text)</div>
                        <div className="upload-section">
                            <button className="btn-primary" onClick={() => fileInputRef.current.click()}>
                                Upload Image
                            </button>
                            <input type="file" ref={fileInputRef} onChange={handleUpload} accept="image/*" style={{display: 'none'}} />
                        </div>
                        <div className="text-list">
                            {texts.length === 0 && <div className="no-data">Image upload karein scan karne ke liye.</div>}
                            {texts.map((item) => (
                                <div key={item.id} className="list-item">
                                    <label>Element #{item.id + 1}</label>
                                    <input 
                                        type="text" 
                                        value={item.text} 
                                        onChange={(e) => handleTextChange(item.id, e.target.value)} 
                                    />
                                </div>
                            ))}
                        </div>
                    </div>

                    {/* CENTER WORKSPACE */}
                    <div className="workspace">
                        {loading && (
                            <div className="loader">
                                <div className="spinner"></div>
                                <div>{statusText}</div>
                            </div>
                        )}
                        <div className="canvas-wrapper">
                            <canvas id="c"></canvas>
                        </div>
                    </div>

                    {/* RIGHT PANEL */}
                    <div className="panel right-panel">
                        <div className="panel-header">Element Properties</div>
                        <div className="tools-body">
                            {selectedObj ? (
                                <>
                                    <div className="form-group">
                                        <label>Text Content</label>
                                        <input 
                                            type="text" 
                                            value={selectedObj.text || ''} 
                                            onChange={(e) => updateProp('text', e.target.value)} 
                                        />
                                    </div>
                                    <div className="form-group">
                                        <label>Font Size (px)</label>
                                        <input 
                                            type="number" 
                                            value={Math.round(selectedObj.fontSize) || 16} 
                                            onChange={(e) => updateProp('fontSize', parseInt(e.target.value))} 
                                        />
                                    </div>
                                    <div className="form-group">
                                        <label>Text Color</label>
                                        <input 
                                            type="color" 
                                            value={selectedObj.fill || '#000000'} 
                                            onChange={(e) => updateProp('fill', e.target.value)} 
                                        />
                                    </div>
                                    <div className="form-group">
                                        <label>Background Color</label>
                                        <input 
                                            type="color" 
                                            value={selectedObj.backgroundColor || '#ffffff'} 
                                            onChange={(e) => updateProp('backgroundColor', e.target.value)} 
                                        />
                                    </div>
                                    <button className="btn-primary btn-danger" onClick={deleteSelected}>
                                        Delete Element
                                    </button>
                                </>
                            ) : (
                                <div className="no-data">Canvas par kisi text ko select karein options dekhne ke liye.</div>
                            )}

                            <div style={{marginTop: 'auto'}}>
                                <button className="btn-primary btn-success" onClick={downloadImage}>
                                    Download Image
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
