<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View49 — YouTube Analytics Studio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: #08090d; color: #f4f4f5; padding: 40px 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        .back-btn { color: #8a8d9b; text-decoration: none; font-size: 14px; display: inline-flex; align-items: center; gap: 8px; margin-bottom: 20px; }
        .back-btn:hover { color: #fff; }
        .card { background: rgba(18, 20, 29, 0.8); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; padding: 30px; }
        .search-box { display: flex; gap: 12px; margin: 20px 0; }
        input { flex: 1; padding: 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); background: #12141d; color: #fff; }
        button { background: #ff2d2d; color: #fff; border: none; padding: 14px 24px; border-radius: 12px; font-weight: 700; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Back to Dashboard</a>
        <div class="card">
            <h2><i class="fa-solid fa-chart-line" style="color:#ff2d2d;"></i> YouTube Analytics Studio</h2>
            <p style="color:#8a8d9b; font-size:14px; margin-top:6px;">Enter Video or Channel URL to extract analytics</p>
            <div class="search-box">
                <input type="text" placeholder="https://www.youtube.com/watch?v=...">
                <button onclick="alert('Analytics Engine Ready!')">Analyze</button>
            </div>
        </div>
    </div>
</body>
</html>
