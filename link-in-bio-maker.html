<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link in Bio Maker — View49 Studio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;1,400&display=swap');

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }

        body {
            background: #08090d;
            background-image: 
                radial-gradient(at 10% 10%, rgba(234, 179, 8, 0.08) 0px, transparent 40%),
                radial-gradient(at 90% 90%, rgba(120, 40, 200, 0.1) 0px, transparent 40%);
            color: #f4f4f5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Navbar */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 6%;
            background: rgba(8, 9, 13, 0.85);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo { font-size: 22px; font-weight: 800; color: #fff; text-decoration: none; display: flex; align-items: center; gap: 10px; }
        .logo span { color: #eab308; }

        .nav-links { display: flex; gap: 20px; list-style: none; align-items: center; }
        .nav-links a { color: #a1a1aa; text-decoration: none; font-size: 14px; font-weight: 600; transition: color 0.2s; }
        .nav-links a:hover { color: #fff; }

        /* Main Studio Layout */
        .studio-container {
            max-width: 1300px;
            margin: 30px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 1fr 420px;
            gap: 40px;
            width: 100%;
            flex: 1;
        }

        /* Editor Section */
        .editor-panel {
            background: rgba(18, 20, 29, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 32px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
        }

        .panel-header {
            margin-bottom: 28px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            padding-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .panel-header h2 {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, #fff 0%, #eab308 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; color: #a1a1aa; margin-bottom: 8px; }
        
        .form-control {
            width: 100%;
            background: rgba(8, 9, 13, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 12px 16px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: all 0.2s;
        }

        .form-control:focus {
            border-color: #eab308;
            box-shadow: 0 0 15px rgba(234, 179, 8, 0.2);
        }

        /* Links Customizer Dynamic Area */
        .link-items { display: flex; flex-direction: column; gap: 14px; margin-top: 20px; }
        
        .link-item-row {
            display: flex;
            gap: 12px;
            background: rgba(255,255,255,0.03);
            padding: 12px;
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.05);
            align-items: center;
        }

        .btn-add-link {
            width: 100%;
            padding: 12px;
            background: rgba(234, 179, 8, 0.1);
            border: 1px dashed rgba(234, 179, 8, 0.4);
            color: #facc15;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.2s;
        }

        .btn-add-link:hover { background: rgba(234, 179, 8, 0.2); }

        .btn-export {
            margin-top: 30px;
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #eab308 0%, #ca8a04 100%);
            color: #000;
            font-weight: 800;
            border: none;
            border-radius: 14px;
            font-size: 15px;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(234, 179, 8, 0.3);
            transition: transform 0.2s;
        }

        .btn-export:hover { transform: translateY(-2px); }

        /* Classic Phone Mockup Preview */
        .preview-wrapper {
            position: sticky;
            top: 100px;
            display: flex;
            justify-content: center;
        }

        .phone-mockup {
            width: 360px;
            height: 680px;
            background: linear-gradient(180deg, #121019 0%, #08090d 100%);
            border: 10px solid #1f212d;
            border-radius: 48px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.8), 0 0 30px rgba(234, 179, 8, 0.15);
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            overflow-y: auto;
        }

        /* Classic Luxury Bio Card Styling */
        .bio-profile-img {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 2px solid #eab308;
            padding: 3px;
            object-fit: cover;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            margin-bottom: 14px;
        }

        .bio-name {
            font-family: 'Playfair Display', serif;
            font-size: 20px;
            font-weight: 600;
            color: #fef08a;
            margin-bottom: 4px;
            text-align: center;
        }

        .bio-tagline {
            font-size: 12px;
            color: #a1a1aa;
            text-align: center;
            margin-bottom: 24px;
            line-height: 1.4;
        }

        .bio-links-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .bio-link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 14px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(234, 179, 8, 0.3);
            border-radius: 30px;
            color: #fff;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            backdrop-filter: blur(10px);
            transition: all 0.3s;
        }

        .bio-link-btn:hover {
            background: rgba(234, 179, 8, 0.15);
            border-color: #eab308;
            transform: translateY(-2px);
        }

        footer { text-align: center; padding: 25px; color: #52525b; font-size: 13px; border-top: 1px solid rgba(255, 255, 255, 0.05); margin-top: auto; }

        @media (max-width: 900px) {
            .studio-container { grid-template-columns: 1fr; }
            .preview-wrapper { position: relative; top: 0; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="logo"><i class="fa-solid fa-bolt"></i> View<span>49</span></a>
        <ul class="nav-links">
            <li><a href="index.html">Dashboard</a></li>
            <li><a href="youtube-seo-checker.html">SEO Checker</a></li>
            <li><a href="premium.html" style="color: #facc15;"><i class="fa-solid fa-crown"></i> VIP Tools</a></li>
        </ul>
    </nav>

    <div class="studio-container">

        <!-- Editor Controls -->
        <div class="editor-panel">
            <div class="panel-header">
                <h2><i class="fa-solid fa-gem"></i> Classic Bio Studio</h2>
                <span style="font-size: 12px; color: #eab308; background: rgba(234,179,8,0.1); padding: 4px 10px; border-radius: 20px;">PRO BUILDER</span>
            </div>

            <div class="form-group">
                <label>Profile Image URL</label>
                <input type="text" id="inputImage" class="form-control" value="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=300" oninput="updatePreview()">
            </div>

            <div class="form-group">
                <label>Display Name</label>
                <input type="text" id="inputName" class="form-control" value="Alex Vance" oninput="updatePreview()">
            </div>

            <div class="form-group">
                <label>Bio / Tagline</label>
                <input type="text" id="inputBio" class="form-control" value="Digital Creator & Visual Architect ✨" oninput="updatePreview()">
            </div>

            <div style="margin-top: 30px;">
                <label style="font-size: 14px; font-weight: 700; color: #fff;">Custom Action Links</label>
                <div class="link-items" id="linkList">
                    <div class="link-item-row">
                        <input type="text" class="form-control link-title" value="My Official YouTube Channel" oninput="updatePreview()">
                        <input type="text" class="form-control link-url" value="https://youtube.com" oninput="updatePreview()">
                    </div>
                    <div class="link-item-row">
                        <input type="text" class="form-control link-title" value="Download My Free Presets" oninput="updatePreview()">
                        <input type="text" class="form-control link-url" value="#" oninput="updatePreview()">
                    </div>
                </div>
                <button class="btn-add-link" onclick="addLinkField()"><i class="fa-solid fa-plus"></i> Add New Link</button>
            </div>

            <button class="btn-export" onclick="alert('Classic Link-in-Bio Page Code Generated Successfully!')"><i class="fa-solid fa-code"></i> Copy Bio Page HTML Code</button>
        </div>

        <!-- Phone Live Preview -->
        <div class="preview-wrapper">
            <div class="phone-mockup">
                <img id="previewImg" class="bio-profile-img" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=300" alt="Profile">
                <div id="previewName" class="bio-name">Alex Vance</div>
                <div id="previewBio" class="bio-tagline">Digital Creator & Visual Architect ✨</div>

                <div class="bio-links-container" id="previewLinks">
                    <!-- Dynamic Links Render Here -->
                </div>
            </div>
        </div>

    </div>

    <footer>
        &copy; 2026 View49 Creator Tools. Classic Bio Studio Module.
    </footer>

    <script>
        function updatePreview() {
            document.getElementById('previewImg').src = document.getElementById('inputImage').value;
            document.getElementById('previewName').innerText = document.getElementById('inputName').value;
            document.getElementById('previewBio').innerText = document.getElementById('inputBio').value;

            const titles = document.querySelectorAll('.link-title');
            const urls = document.querySelectorAll('.link-url');
            const previewContainer = document.getElementById('previewLinks');

            previewContainer.innerHTML = '';

            titles.forEach((titleInput, index) => {
                const titleVal = titleInput.value;
                const urlVal = urls[index] ? urls[index].value : '#';

                if (titleVal.trim() !== '') {
                    const a = document.createElement('a');
                    a.className = 'bio-link-btn';
                    a.href = urlVal;
                    a.target = '_blank';
                    a.innerHTML = `<i class="fa-solid fa-arrow-up-right-from-square" style="font-size:11px; color:#eab308;"></i> ${titleVal}`;
                    previewContainer.appendChild(a);
                }
            });
        }

        function addLinkField() {
            const linkList = document.getElementById('linkList');
            const div = document.createElement('div');
            div.className = 'link-item-row';
            div.innerHTML = `
                <input type="text" class="form-control link-title" placeholder="Button Title" oninput="updatePreview()">
                <input type="text" class="form-control link-url" placeholder="URL Link" oninput="updatePreview()">
            `;
            linkList.appendChild(div);
            updatePreview();
        }

        // Initial Load
        updatePreview();
    </script>
</body>
</html>
