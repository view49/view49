<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>View49 - YouTube & Content Tools</title>

<style>
    * { box-sizing: border-box; }

    body {
        background: #0a0a0a;
        color: #fff;
        font-family: system-ui, -apple-system, sans-serif;
        margin: 0;
        padding: 30px 20px;
    }

    h1 {
        text-align: center;
        color: #ff2d2d;
        font-size: 26px;
        margin-bottom: 40px;
        text-shadow: 0 0 12px rgba(255,45,45,0.6);
    }

    .grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 18px;
        max-width: 1100px;
        margin: 0 auto;
    }

    @media (max-width: 900px) {
        .grid { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 500px) {
        .grid { grid-template-columns: 1fr; }
    }

    .card {
        background: #141414;
        border: 1px solid #2a2a2a;
        border-radius: 10px;
        padding: 18px 14px;
        text-align: center;
        transition: transform 0.15s ease, border-color 0.15s ease;
    }

    .card:hover {
        transform: translateY(-3px);
        border-color: #ff2d2d;
    }

    .card-title {
        font-size: 14px;
        font-weight: 700;
        margin-bottom: 14px;
        min-height: 34px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .open-btn {
        display: block;
        width: 100%;
        background: #e01313;
        color: #fff;
        text-decoration: none;
        font-weight: 700;
        font-size: 13px;
        padding: 10px 0;
        border-radius: 6px;
        border: none;
        cursor: pointer;
    }

    .open-btn:hover {
        background: #ff2d2d;
    }
</style>
</head>

<body>

<h1>🔥 YouTube & Content Tools</h1>

<div class="grid">

    <div class="card">
        <div class="card-title">Bilibili Multi Viewer</div>
        <a class="open-btn" href="bilibili.html" target="_blank">Open Tool</a>
    </div>

    <div class="card">
        <div class="card-title">YouTube Multi Viewer</div>
        <a class="open-btn" href="youtube-multi-viewer.html" target="_blank">Open Tool</a>
    </div>

    <div class="card">
        <div class="card-title">YouTube Thumbnail Downloader</div>
        <a class="open-btn" href="youtube-thumbnail-downloader.html" target="_blank">Open Tool</a>
    </div>

    <div class="card">
        <div class="card-title">Tags & Description Generator</div>
        <a class="open-btn" href="tags-description-generator.html" target="_blank">Open Tool</a>
    </div>

    <div class="card">
        <div class="card-title">YouTube SEO Checker</div>
        <a class="open-btn" href="youtube-seo-checker.html" target="_blank">Open Tool</a>
    </div>

    <div class="card">
        <div class="card-title">YouTube Link Shortener</div>
        <a class="open-btn" href="youtube-link-shortener.html" target="_blank">Open Tool</a>
    </div>

</div>

</body>
</html>
