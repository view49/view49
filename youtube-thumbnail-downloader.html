<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Thumbnail Downloader</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body {
            background: #0b0f19;
            color: #e2e8f0;
            font-family: system-ui, -apple-system, sans-serif;
        }

        .glow-border {
            background: linear-gradient(90deg, #ff0000, #3b82f6);
            padding: 2px;
            border-radius: 18px;
        }

        .custom-card { background: #121826; }

        .thumb-card {
            background: #121826;
            border: 1px solid #263247;
            border-radius: 16px;
            overflow: hidden;
        }

        .thumb-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .thumb-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #statusMessage { min-height: 20px; }
    </style>
</head>

<body class="min-h-screen p-4">

    <div class="glow-border w-full max-w-4xl mx-auto shadow-2xl">
        <div class="custom-card rounded-2xl p-6 md:p-8">

            <div class="flex justify-between items-center mb-6">
                <span class="bg-red-950/80 text-red-400 border border-red-800/50 text-xs font-bold px-4 py-2 rounded-full">
                    ● Thumbnail Engine 2026
                </span>
                <div class="flex items-center gap-2">
                    <span class="bg-slate-800 text-yellow-400 text-xs font-bold px-3 py-2 rounded-full border border-slate-700">
                        📺 View49
                    </span>
                    <span class="bg-slate-800 text-cyan-400 text-xs font-semibold px-3 py-2 rounded-full border border-slate-700">
                        🏠 HELPVIEW
                    </span>
                </div>
            </div>

            <div class="text-center mb-8">
                <h1 class="text-3xl md:text-5xl font-extrabold text-white mb-3">
                    YouTube Thumbnail Downloader
                </h1>
                <p class="text-slate-400 text-sm max-w-2xl mx-auto">
                    Paste any YouTube video URL or ID to instantly get
                    every available thumbnail resolution, ready to download.
                </p>
            </div>

            <div class="space-y-4">

                <input
                    id="videoUrl"
                    type="text"
                    placeholder="Paste YouTube URL or video ID"
                    class="w-full bg-[#0d1322] border border-slate-700 rounded-xl px-4 py-4 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-red-500"
                />

                <button onclick="fetchThumbnails()" class="w-full bg-gradient-to-r from-red-600 to-red-500 hover:from-red-700 hover:to-red-600 text-white font-bold px-6 py-3 rounded-xl shadow-lg">
                    🔍 Get Thumbnails
                </button>

                <div id="statusMessage" class="text-center text-xs text-slate-400"></div>

            </div>

        </div>
    </div>

    <div id="thumbGrid" class="w-full max-w-4xl mx-auto mt-6 grid grid-cols-1 md:grid-cols-2 gap-4"></div>

<script>

function extractVideoId(input) {
    input = input.trim();
    if (!input) return null;

    const pattern = /(?:youtube\.com\/watch\?v=|youtube\.com\/embed\/|youtube\.com\/shorts\/|youtu\.be\/)([a-zA-Z0-9_-]{11})/;
    const match = input.match(pattern);
    if (match) return match[1];

    if (/^[a-zA-Z0-9_-]{11}$/.test(input)) return input;

    return null;
}

const RESOLUTIONS = [
    { key: "maxresdefault", label: "Max Resolution (1280x720)" },
    { key: "sddefault", label: "Standard Definition (640x480)" },
    { key: "hqdefault", label: "High Quality (480x360)" },
    { key: "mqdefault", label: "Medium Quality (320x180)" },
    { key: "default", label: "Default (120x90)" }
];

function fetchThumbnails() {
    const input = document.getElementById("videoUrl").value;
    const status = document.getElementById("statusMessage");
    const grid = document.getElementById("thumbGrid");

    const videoId = extractVideoId(input);

    if (!videoId) {
        status.innerHTML = '<span class="text-red-400">Please enter a valid YouTube URL or video ID.</span>';
        grid.innerHTML = "";
        return;
    }

    status.innerHTML = `<span class="text-green-400">Loaded thumbnails for: ${escapeHtml(videoId)}</span>`;

    grid.innerHTML = "";
    const fragment = document.createDocumentFragment();

    RESOLUTIONS.forEach(res => {
        const imgUrl = `https://img.youtube.com/vi/${encodeURIComponent(videoId)}/${res.key}.jpg`;

        const card = document.createElement("div");
        card.className = "thumb-card p-3 shadow-xl";

        card.innerHTML = `
            <div class="text-xs text-slate-400 mb-2">${escapeHtml(res.label)}</div>
            <div class="thumb-wrapper mb-3">
                <img src="${imgUrl}" alt="${escapeHtml(res.label)}" loading="lazy"
                    onerror="this.parentElement.innerHTML='<span class=\\'text-xs text-slate-600\\'>Not available</span>'" />
            </div>
            <a href="${imgUrl}" download="thumbnail-${escapeHtml(videoId)}-${res.key}.jpg" target="_blank"
                class="block text-center bg-slate-800 hover:bg-slate-700 border border-slate-700 text-white text-sm font-semibold px-4 py-2 rounded-xl">
                ⬇ Download
            </a>
        `;

        fragment.appendChild(card);
    });

    grid.appendChild(fragment);
}

function escapeHtml(value) {
    const div = document.createElement("div");
    div.textContent = value;
    return div.innerHTML;
}

document.getElementById("videoUrl").addEventListener("keydown", function (event) {
    if (event.key === "Enter") fetchThumbnails();
});

</script>

</body>
</html>
