<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live YouTube Channel Earnings & Analytics Studio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
        body { background: #0a0a0a; color: #fff; padding: 30px 20px; }
        
        .container { max-width: 950px; margin: 0 auto; background: #121212; border: 1px solid #262626; border-radius: 14px; padding: 28px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .header-title { font-size: 22px; font-weight: 800; color: #ff2d2d; margin-bottom: 24px; text-align: center; display: flex; align-items: center; justify-content: center; gap: 10px; }
        
        .search-box { display: flex; gap: 10px; margin-bottom: 20px; }
        .search-input { flex: 1; padding: 14px 16px; background: #1a1a1a; border: 1px solid #333; border-radius: 8px; color: #fff; font-size: 14px; outline: none; }
        .search-input:focus { border-color: #ff2d2d; background: #222; }
        
        .btn-calc { background: linear-gradient(135deg, #e01313, #ff2d2d); color: white; border: none; padding: 0 24px; font-weight: 700; font-size: 14px; border-radius: 8px; cursor: pointer; transition: 0.2s; white-space: nowrap; display: flex; align-items: center; gap: 8px; }
        .btn-calc:hover { opacity: 0.9; }

        /* Channel Header Profile */
        .channel-header { display: none; align-items: center; gap: 16px; background: #18181b; border: 1px solid #27272a; padding: 16px; border-radius: 10px; margin-bottom: 24px; }
        .channel-avatar { width: 64px; height: 64px; border-radius: 50%; border: 2px solid #ff2d2d; object-fit: cover; }
        .channel-info h2 { font-size: 18px; color: #fff; }
        .channel-info p { font-size: 12px; color: #a1a1aa; margin-top: 2px; }

        /* Analytics Dashboard */
        .analytics-dashboard { display: none; border-top: 1px solid #262626; padding-top: 24px; }
        .dashboard-title { font-size: 16px; font-weight: 700; color: #f4f4f5; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 24px; }
        @media (max-width: 800px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 480px) { .stats-grid { grid-template-columns: 1fr; } }
        
        .stat-card { background: #18181b; border: 1px solid #27272a; padding: 16px; border-radius: 10px; text-align: center; }
        .stat-card .label { font-size: 11px; color: #71717a; text-transform: uppercase; font-weight: 600; margin-bottom: 6px; }
        .stat-card .value { font-size: 18px; font-weight: 800; color: #facc15; }
        .stat-card .sub-value { font-size: 11px; color: #22c55e; margin-top: 4px; }

        .chart-box { background: #18181b; border: 1px solid #27272a; border-radius: 12px; padding: 20px; height: 320px; display: flex; justify-content: center; align-items: center; position: relative; }
        .error-msg { color: #ef4444; font-size: 13px; margin-top: 8px; display: none; }
        .loading-text { font-size: 13px; color: #facc15; margin-top: 8px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-title">
        <i class="fa-brands fa-youtube" style="color: #ff2d2d;"></i> YouTube Live Earnings & Channel Analytics
    </div>

    <div class="search-box">
        <input type="text" id="channelInput" class="search-input" placeholder="Paste YouTube Link or Handle (e.g. @MrBeast, @CarryMinati)...">
        <button class="btn-calc" onclick="fetchChannelData()"><i class="fa-solid fa-bolt"></i> Fetch Analytics</button>
    </div>
    <div id="loadingText" class="loading-text"><i class="fa-solid fa-spinner fa-spin"></i> Fetching live channel metrics...</div>
    <div id="errorMsg" class="error-msg"></div>

    <!-- Live Channel Profile Header -->
    <div class="channel-header" id="channelHeader">
        <img id="cAvatar" class="channel-avatar" src="" alt="Avatar">
        <div class="channel-info">
            <h2 id="cTitle">Channel Name</h2>
            <p id="cHandle">@handle</p>
        </div>
    </div>

    <!-- Live Analytics Results Dashboard -->
    <div class="analytics-dashboard" id="dashboard">
        <div class="dashboard-title"><i class="fa-solid fa-chart-pie"></i> Revenue & Performance Breakdown</div>
        
        <div class="stats-grid">
            <div class="stat-card">
                <div class="label">Live Subscribers</div>
                <div class="value" id="resSubscribers">0</div>
                <div class="sub-value" id="resVideos">0 Total Uploads</div>
            </div>
            <div class="stat-card">
                <div class="label">Est. Weekly Revenue</div>
                <div class="value" id="resWeekly">$0</div>
                <div class="sub-value">AdSense + Sponsorships</div>
            </div>
            <div class="stat-card">
                <div class="label">Est. Monthly Revenue</div>
                <div class="value" id="resMonthly">$0</div>
                <div class="sub-value">Current Growth Rate</div>
            </div>
            <div class="stat-card">
                <div class="label">Est. Yearly Potential</div>
                <div class="value" id="resYearly">$0</div>
                <div class="sub-value">Annual Projection</div>
            </div>
        </div>

        <div class="chart-box">
            <canvas id="revenueChart"></canvas>
        </div>
    </div>
</div>

<script>
    // Embedded API Key
    const API_KEY = 'AIzaSyDTUlX9MF-hSYKArIr13aPaza_GikKyrFY';
    let myChart = null;

    async function fetchChannelData() {
        const query = document.getElementById('channelInput').value.trim();
        const errorMsg = document.getElementById('errorMsg');
        const loadingText = document.getElementById('loadingText');

        errorMsg.style.display = 'none';
        loadingText.style.display = 'none';

        if (!query) {
            showError("Please enter a YouTube channel link or handle.");
            return;
        }

        loadingText.style.display = 'block';

        // Extract clean handle or name
        let cleanHandle = query.replace(/https?:\/\/(www\.)?youtube\.com\//, '').replace('@', '').split('/')[0];

        try {
            // First attempt: fetch by handle
            let url = `https://www.googleapis.com/youtube/v3/channels?part=snippet,statistics&forHandle=${cleanHandle}&key=${API_KEY}`;
            let response = await fetch(url);
            let data = await response.json();

            // Second attempt: search channel ID if handle lookup fails
            if (!data.items || data.items.length === 0) {
                let searchUrl = `https://www.googleapis.com/youtube/v3/search?part=snippet&type=channel&q=${cleanHandle}&key=${API_KEY}`;
                let searchRes = await fetch(searchUrl);
                let searchData = await searchRes.json();
                
                if (searchData.items && searchData.items.length > 0) {
                    let channelId = searchData.items[0].id.channelId;
                    url = `https://www.googleapis.com/youtube/v3/channels?part=snippet,statistics&id=${channelId}&key=${API_KEY}`;
                    response = await fetch(url);
                    data = await response.json();
                }
            }

            loadingText.style.display = 'none';

            if (data.items && data.items.length > 0) {
                renderDashboard(data.items[0]);
            } else {
                showError("Channel not found. Please check the link or handle.");
            }

        } catch (err) {
            loadingText.style.display = 'none';
            showError("Unable to fetch data right now. Please check the URL.");
        }
    }

    function renderDashboard(channel) {
        const snippet = channel.snippet;
        const stats = channel.statistics;

        // Profile Header
        document.getElementById('cAvatar').src = snippet.thumbnails.default.url;
        document.getElementById('cTitle').innerText = snippet.title;
        document.getElementById('cHandle').innerText = snippet.customUrl ? snippet.customUrl : '@' + snippet.title;
        document.getElementById('channelHeader').style.display = 'flex';

        // Metrics
        const subs = parseInt(stats.subscriberCount) || 0;
        const totalViews = parseInt(stats.viewCount) || 0;
        const videoCount = parseInt(stats.videoCount) || 1;

        const avgViewsPerVideo = Math.round(totalViews / videoCount);

        // Earnings Calculation Algorithm
        const estAdsensePerVideo = (avgViewsPerVideo / 1000) * 3.2; // ~$3.2 RPM
        const estSponsorPerVideo = (avgViewsPerVideo / 1000) * 14;  // Brand sponsorships
        
        const estPerVideoTotal = estAdsensePerVideo + estSponsorPerVideo;
        
        // Estimation: 2 videos per week
        const weeklyEst = estPerVideoTotal * 2;
        const monthlyEst = weeklyEst * 4;
        const yearlyEst = monthlyEst * 12;

        document.getElementById('resSubscribers').innerText = subs.toLocaleString();
        document.getElementById('resVideos').innerText = `${videoCount.toLocaleString()} Total Videos`;
        
        document.getElementById('resWeekly').innerText = '$' + Math.round(weeklyEst).toLocaleString();
        document.getElementById('resMonthly').innerText = '$' + Math.round(monthlyEst).toLocaleString();
        document.getElementById('resYearly').innerText = '$' + Math.round(yearlyEst).toLocaleString();

        document.getElementById('dashboard').style.display = 'block';

        renderChart(Math.round(estSponsorPerVideo * 8), Math.round(estAdsensePerVideo * 8));
    }

    function renderChart(sponsorMonthly, adsenseMonthly) {
        const ctx = document.getElementById('revenueChart').getContext('2d');
        if (myChart) myChart.destroy();

        myChart = new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: ['Brand Sponsorships', 'YouTube AdSense Revenue'],
                datasets: [{
                    data: [sponsorMonthly, adsenseMonthly],
                    backgroundColor: ['#ff2d2d', '#facc15'],
                    borderWidth: 0
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { position: 'bottom', labels: { color: '#a1a1aa' } },
                    title: { display: true, text: 'Monthly Revenue Breakdown ($)', color: '#ffffff', font: { size: 14, weight: 'bold' } }
                }
            }
        });
    }

    function showError(msg) {
        const errorMsg = document.getElementById('errorMsg');
        errorMsg.innerText = msg;
        errorMsg.style.display = 'block';
    }
</script>

</body>
</html>
