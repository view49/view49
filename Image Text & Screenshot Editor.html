<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Screenshot & Image Text Editor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: #0a0a0a;
            color: #e2e8f0;
            font-family: system-ui, -apple-system, sans-serif;
        }
        canvas { cursor: grab; }
        canvas:active { cursor: grabbing; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 flex flex-col items-center">

    <div class="w-full max-w-6xl bg-[#141414] border border-[#2a2a2a] rounded-2xl p-6 shadow-2xl">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-xl font-bold text-white">🖼️ Advanced Image Text & Screenshot Editor</h1>
            <a href="index.html" class="text-xs bg-slate-800 text-slate-300 px-3 py-1.5 rounded-lg border border-slate-700 hover:text-white">← Back to Dashboard</a>
        </div>

        <!-- Upload Box -->
        <div class="mb-6 border-2 border-dashed border-slate-700 hover:border-blue-500 rounded-xl p-6 text-center bg-[#0d1322] cursor-pointer" onclick="document.getElementById('imageLoader').click()">
            <input type="file" id="imageLoader" accept="image/*" class="hidden">
            <p class="text-sm font-semibold text-slate-300">📁 Click to upload your screenshot or image</p>
            <p class="text-xs text-slate-500 mt-1">Supports PNG, JPG, WEBP</p>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
            <!-- Controls Sidebar -->
            <div class="bg-[#0f1523] p-4 rounded-xl border border-slate-800 space-y-4 lg:col-span-1">
                <h3 class="text-xs font-bold tracking-wider text-blue-400 uppercase">Text / Number Customization</h3>
                
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Text or Number</label>
                    <input type="text" id="textInput" value="99.9%" class="w-full bg-[#090d16] border border-slate-700 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-blue-500">
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Font Size (px)</label>
                        <input type="number" id="fontSize" value="32" class="w-full bg-[#090d16] border border-slate-700 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Text Color</label>
                        <input type="color" id="textColor" value="#00ffcc" class="w-full h-9 bg-[#090d16] border border-slate-700 rounded-lg px-1 py-1 cursor-pointer">
                    </div>
                </div>

                <div>
                    <label class="block text-xs text-slate-400 mb-1">Font Style</label>
                    <select id="fontFamily" class="w-full bg-[#090d16] border border-slate-700 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-blue-500">
                        <option value="sans-serif">Sans Serif</option>
                        <option value="serif">Serif</option>
                        <option value="monospace">Monospace</option>
                        <option value="Arial">Arial</option>
                    </select>
                </div>

                <button onclick="addTextObject()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-xl text-xs transition shadow-md">
                    ➕ Add Movable Text
                </button>

                <div class="p-3 bg-slate-900/80 border border-slate-800 rounded-lg text-xs text-slate-400 space-y-1">
                    <p>💡 <strong class="text-white">Instructions:</strong></p>
                    <p>1. Click "Add Movable Text".</p>
                    <p>2. <b>Drag & Drop</b> text anywhere on the image.</p>
                </div>

                <button onclick="downloadImage()" class="w-full bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-700 hover:to-teal-700 text-white font-bold py-3 rounded-xl text-xs transition shadow-lg">
                    📥 Download Final Image
                </button>
            </div>

            <!-- Canvas Workspace Area -->
            <div class="lg:col-span-3 bg-[#090d16] border border-slate-800 rounded-xl p-4 flex items-center justify-center overflow-auto min-h-[450px]">
                <canvas id="imageCanvas" class="max-w-full rounded shadow-xl"></canvas>
            </div>
        </div>
    </div>

    <script>
        const imageLoader = document.getElementById('imageLoader');
        const canvas = document.getElementById('imageCanvas');
        const ctx = canvas.getContext('2d');
        
        let uploadedImage = new Image();
        let textObjects = []; 
        let selectedIndex = -1;
        let isDragging = false;
        let startX = 0;
        let startY = 0;

        imageLoader.addEventListener('change', function(e) {
            const reader = new FileReader();
            reader.onload = function(event) {
                uploadedImage.onload = function() {
                    canvas.width = uploadedImage.width;
                    canvas.height = uploadedImage.height;
                    redrawCanvas();
                }
                uploadedImage.src = event.target.result;
            }
            reader.readAsDataURL(e.target.files[0]);
        });

        window.onload = function() {
            canvas.width = 700;
            canvas.height = 400;
            ctx.fillStyle = "#121826";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#64748b";
            ctx.font = "16px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText("Upload an image or screenshot to begin editing", canvas.width / 2, canvas.height / 2);
        }

        function redrawCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (uploadedImage.src) {
                ctx.drawImage(uploadedImage, 0, 0);
            }

            // Draw all text items
            textObjects.forEach((t, index) => {
                ctx.font = `${t.size}px ${t.font}`;
                ctx.fillStyle = t.color;
                ctx.fillText(t.text, t.x, t.y);

                // Highlight border box if selected
                if (index === selectedIndex) {
                    const metrics = ctx.measureText(t.text);
                    ctx.strokeStyle = '#3b82f6';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(t.x - 4, t.y - t.size, metrics.width + 8, t.size + 6);
                }
            });
        }

        function addTextObject() {
            const textValue = document.getElementById('textInput').value;
            const size = parseInt(document.getElementById('fontSize').value);
            const color = document.getElementById('textColor').value;
            const font = document.getElementById('fontFamily').value;

            textObjects.push({
                text: textValue,
                x: canvas.width / 2 - 40,
                y: canvas.height / 2,
                size: size,
                color: color,
                font: font
            });
            selectedIndex = textObjects.length - 1;
            redrawCanvas();
        }

        // Mouse down event for dragging
        canvas.addEventListener('mousedown', function(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const mouseX = (e.clientX - rect.left) * scaleX;
            const mouseY = (e.clientY - rect.top) * scaleY;

            selectedIndex = -1;
            for (let i = textObjects.length - 1; i >= 0; i--) {
                const t = textObjects[i];
                ctx.font = `${t.size}px ${t.font}`;
                const metrics = ctx.measureText(t.text);
                
                // Check if click is inside text bounding box
                if (mouseX >= t.x - 5 && mouseX <= t.x + metrics.width + 5 && mouseY <= t.y + 5 && mouseY >= t.y - t.size - 5) {
                    selectedIndex = i;
                    isDragging = true;
                    startX = mouseX - t.x;
                    startY = mouseY - t.y;
                    break;
                }
            }
            redrawCanvas();
        });

        // Dragging text around
        canvas.addEventListener('mousemove', function(e) {
            if (!isDragging || selectedIndex === -1) return;
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const mouseX = (e.clientX - rect.left) * scaleX;
            const mouseY = (e.clientY - rect.top) * scaleY;

            textObjects[selectedIndex].x = mouseX - startX;
            textObjects[selectedIndex].y = mouseY - startY;
            redrawCanvas();
        });

        canvas.addEventListener('mouseup', () => { isDragging = false; });
        canvas.addEventListener('mouseout', () => { isDragging = false; });

        function downloadImage() {
            selectedIndex = -1; // Deselect to hide selection outline
            redrawCanvas();
            
            const link = document.createElement('a');
            link.download = 'edited-screenshot.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }
    </script>
</body>
</html>
