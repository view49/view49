<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login — View49</title><style>body{font-family:Arial;background:#08090d;color:#fff;display:grid;place-items:center;min-height:100vh}.card{width:min(380px,90vw);background:#121522;padding:30px;border-radius:18px}input,button{width:100%;padding:12px;margin:8px 0;border-radius:9px;box-sizing:border-box}input{background:#0d0f17;border:1px solid #333;color:#fff}button{background:#e01313;color:#fff;border:0;font-weight:bold;cursor:pointer}.err{color:#ff6b6b}</style></head><body><div class="card"><h1>Welcome back</h1><p>Login to View49</p><form id="form"><input id="email" type="email" placeholder="Email" required><input id="password" type="password" placeholder="Password" required><button>Login</button><div id="error" class="err"></div></form><p>New user? <a href="signup.html">Create account</a></p></div><script src="auth.js"></script><script>form.onsubmit=async e=>{e.preventDefault();error.textContent='';try{await View49Auth.login(email.value,password.value);location.href='index.html'}catch(x){error.textContent=x.message}}</script></body></html>
