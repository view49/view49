<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create Your Resume/CV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;600;700&family=Merriweather:wght@400;700&family=Montserrat:wght@400;500;600;700&family=Nunito:wght@400;600;700&family=Poppins:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
    --blue: #0b6efd;
    --red: #dc3545;
    --ink: #1c2230;
    --dim: #6b7280;
    --line: #e3e6ea;
    --bg: #f2f4f7;
    --card: #ffffff;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Poppins', system-ui, sans-serif; background: var(--bg); color: var(--ink); font-size: 14px; }

.top { text-align: center; padding: 18px 12px; background: #fff; border-bottom: 3px solid var(--line); position: relative; }
.top h1 { font-size: 28px; font-weight: 600; }
.top h1 span { color: var(--blue); }
.top .reset { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); font: inherit; font-size: 12px; background: none; border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; cursor: pointer; color: var(--dim); }
.top .reset:hover { color: var(--red); border-color: var(--red); }

.layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; max-width: 1280px; margin: 20px auto; padding: 0 16px; align-items: start; }
@media (max-width: 900px) { .layout { grid-template-columns: 1fr; } .top .reset { position: static; transform: none; margin-top: 8px; } }

/* ---------- form ---------- */
#form { display: flex; flex-direction: column; gap: 16px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 20px 22px; box-shadow: 0 1px 4px rgba(0,0,0,.04); }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 16px; }
.card-head h2, .title-in { font-size: 19px; font-weight: 600; padding-bottom: 4px; border-bottom: 2px solid var(--ink); display: inline-block; }
.title-in { border-top: 0; border-left: 0; border-right: 0; background: transparent; font-family: inherit; color: var(--ink); outline: none; min-width: 0; width: 60%; border-radius: 0; }
.mv { display: inline-flex; gap: 4px; flex-shrink: 0; align-items: center; }
.mv button { width: 28px; height: 28px; border: 1px solid var(--line); background: #fff; border-radius: 6px; cursor: pointer; font-size: 11px; color: var(--ink); line-height: 1; }
.mv button:hover:not(:disabled) { border-color: var(--blue); color: var(--blue); }
.mv button:disabled { opacity: .3; cursor: default; }
.mv .danger { color: #fff; background: var(--red); border-color: var(--red); font-size: 13px; }
.mv .danger:hover:not(:disabled) { color: #fff; background: #b82a37; border-color: #b82a37; }

.field { margin-bottom: 14px; }
.lbl { display: flex; align-items: center; justify-content: space-between; margin-bottom: 5px; gap: 8px; }
.lbl label { font-weight: 600; font-size: 13px; }
.lbl-in { font: inherit; font-size: 13px; font-weight: 600; border: 0; border-bottom: 1px dashed #b9bec7; background: transparent; padding: 2px 0; min-width: 0; flex: 1; color: var(--ink); }
.lbl-in:focus { outline: none; border-bottom-color: var(--blue); }
.req { color: var(--red); }
input[type=text], input[type=tel], input[type=email], input[type=date], select, textarea {
    width: 100%; font: inherit; font-size: 13.5px; padding: 8px 11px; border: 1px solid var(--line); border-radius: 6px; background: #fff; color: var(--ink);
}
input:focus, select:focus, textarea:focus { outline: 2px solid rgba(11,110,253,.25); border-color: var(--blue); }
textarea { min-height: 90px; resize: vertical; margin-top: 10px; }
.invalid { border-color: var(--red) !important; }

.photo-row { display: flex; align-items: center; gap: 16px; margin-top: 6px; }
.photo-row img { width: 84px; height: 96px; object-fit: cover; border-radius: 6px; background: #e8eaee; }
.btn-grey { font: inherit; font-size: 13px; background: #6c757d; color: #fff; border: 0; border-radius: 6px; padding: 8px 14px; cursor: pointer; }
.btn-grey:hover { background: #565e64; }
.btn-line { font: inherit; font-size: 12px; background: #fff; color: var(--blue); border: 1px solid var(--blue); border-radius: 6px; padding: 5px 12px; cursor: pointer; white-space: nowrap; }
.btn-line:hover { background: var(--blue); color: #fff; }
.btn-wide { width: 100%; font: inherit; font-size: 14px; border: 0; border-radius: 6px; padding: 10px; cursor: pointer; color: #fff; }
.btn-wide.blue { background: var(--blue); font-size: 15px; padding: 12px; font-weight: 500; } .btn-wide.blue:hover { background: #0a5ad4; }

.addrow { display: flex; gap: 8px; align-items: center; margin-top: 6px; }
.addrow select { flex: 1; }
.addbar { background: #fff; border: 2px dashed #c4c9d2; border-radius: 10px; padding: 14px 16px; }
.addbar .t { font-weight: 600; font-size: 13px; margin-bottom: 8px; }

.dgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
@media (max-width: 640px) { .dgrid { grid-template-columns: 1fr; } }
.swatches { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.swatches button { width: 26px; height: 26px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px #c4c9d2; cursor: pointer; }
.swatches button.on { box-shadow: 0 0 0 2px var(--blue); }
.swatches input[type=color] { width: 34px; height: 28px; padding: 0; border: 1px solid var(--line); border-radius: 6px; background: #fff; cursor: pointer; }

.qrow { display: grid; grid-template-columns: 1.3fr 1.3fr .7fr .7fr auto; gap: 8px; align-items: center; margin-bottom: 8px; }
.qrow .rm { font: inherit; font-size: 12px; background: var(--red); color: #fff; border: 0; border-radius: 5px; padding: 7px 10px; cursor: pointer; width: auto; height: auto; }
.prow { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
@media (max-width: 640px) { .qrow { grid-template-columns: 1fr 1fr; } }

#msg { display: none; background: #fdecee; border: 1px solid #f3b9c0; color: #8a1c28; border-radius: 8px; padding: 10px 14px; font-size: 13px; }
#msg.show { display: block; }

/* ---------- preview ---------- */
.preview-col { position: sticky; top: 16px; max-height: calc(100vh - 32px); overflow: auto; }
@media (max-width: 900px) { .preview-col { position: static; max-height: none; } }
.preview-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.preview-bar b { font-weight: 600; }
.preview-bar button { font: inherit; font-size: 13px; background: var(--blue); color: #fff; border: 0; border-radius: 6px; padding: 7px 14px; cursor: pointer; }

.paper {
    --acc: #1c2230; --acc-ink: #fff;
    background: #fff; padding: 28px 32px; box-shadow: 0 6px 24px rgba(0,0,0,.12);
    font-size: 12.5px; line-height: 1.55; min-height: 400px; color: #1c2230;
}
.p-heading { text-align: center; font-weight: 700; font-size: 1.35em; letter-spacing: .18em; padding-bottom: 8px; border-bottom: 2px solid var(--acc); color: var(--acc); margin-bottom: 14px; }
.p-head { display: flex; justify-content: space-between; gap: 16px; margin-bottom: 8px; }
.p-photo { width: 92px; height: 108px; object-fit: cover; border: 1px solid var(--line); flex-shrink: 0; }
.p-photo.round { width: 100px; height: 100px; border-radius: 50%; }
.p-name { font-size: 1.7em; font-weight: 700; line-height: 1.2; color: var(--acc); }
.p-role { color: var(--dim); font-style: italic; margin-bottom: 4px; }
.p-line b { font-weight: 600; }
.p-sec { margin-top: 14px; }
.p-sec h3 { font-size: 1.08em; font-weight: 700; padding-bottom: 3px; border-bottom: 1.5px solid var(--acc); color: var(--acc); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .04em; }
.s-bar .p-sec h3 { background: var(--acc); color: var(--acc-ink); border-bottom: 0; padding: 4px 10px; }
.p-sec ul { padding-left: 18px; }
.p-sec table { width: 100%; border-collapse: collapse; }
.p-sec th, .p-sec td { border: 1px solid #c9ccd3; padding: 4px 8px; text-align: left; font-size: .96em; }
.p-sec th { background: #f1f2f5; font-weight: 600; }
.p-sec td.k { width: 38%; font-weight: 600; border: 0; padding-left: 0; }
.p-sec td.v { border: 0; }
.p-foot { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; margin-top: 40px; break-inside: avoid; page-break-inside: avoid; }
.p-foot .l div { line-height: 1.9; }
.p-foot .l b { font-weight: 600; }
.p-foot .r { text-align: center; min-width: 150px; }
.p-foot .sig { border-top: 1.5px solid #1c2230; padding-top: 4px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; margin-top: 38px; }
.p-empty { color: var(--dim); text-align: center; padding: 60px 0; }

@media print {
    @page { margin: 12mm; }
    body { background: #fff; }
    .top, #form, .preview-bar { display: none !important; }
    .layout { display: block; margin: 0; padding: 0; max-width: none; }
    .preview-col { position: static; max-height: none; overflow: visible; }
    .paper { box-shadow: none; padding: 0; }
    .paper, .p-sec th, .s-bar .p-sec h3 { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}
</style>
</head>
<body>

<header class="top">
    <h1>Create Your <span>Resume/CV</span></h1>
    <button class="reset" id="resetBtn" type="button">Reset form</button>
</header>

<main class="layout">
    <div id="form"></div>
    <aside class="preview-col">
        <div class="preview-bar"><b>Live preview</b><button type="button" id="printBtn">Save as PDF / Print</button></div>
        <div class="paper" id="paper"></div>
    </aside>
</main>

<script>
/* ================= definitions ================= */
const BASIC = {
    name:     { label: 'Enter Full Name', short: 'Name', req: true },
    house:    { label: 'House No.', short: 'House No.', req: true },
    landmark: { label: 'Landmark / Near by / Gali no.', short: 'Landmark' },
    area:     { label: 'Area / Locality', short: 'Area', req: true },
    city:     { label: 'State / City', short: 'State / City', req: true },
    pincode:  { label: 'Pincode', short: 'Pincode', req: true, type: 'tel' },
    mobile:   { label: 'Mobile No.', short: 'Mobile', req: true, type: 'tel' },
    email:    { label: 'Email Id', short: 'Email', type: 'email' },
    profile:  { label: 'What is your Profile ?', short: 'Profile', ph: 'Web Designer, Computer Operator' }
};
const PERSONAL = {
    gender:      { label: 'Gender', req: true, options: ['Male', 'Female', 'Other'] },
    father:      { label: "Father's Name", req: true },
    dob:         { label: 'Date of Birth', req: true, type: 'date' },
    lang:        { label: 'Language known', req: true, ph: 'Hindi & English' },
    nationality: { label: 'Nationality', req: true, ph: 'Indian' },
    marital:     { label: 'Marital status', req: true, options: ['Single', 'Married', 'Divorced', 'Widowed'] }
};
const TITLES = {
    basic: 'Basic Details', objective: 'Career Objective', qualification: 'Qualification',
    other: 'Other Qualification', work: 'Work Experience', personal: 'Personal Details'
};
const PRESETS = {
    skills:        { label: 'Skills', points: [''] },
    achievements:  { label: 'Achievements', points: [''] },
    projects:      { label: 'Projects', points: [''] },
    certifications:{ label: 'Certifications', points: [''] },
    hobbies:       { label: 'Hobbies', points: [''] },
    references:    { label: 'References', points: [''] },
    declaration:   { label: 'Declaration', points: ['I hereby declare that the information given above is true to the best of my knowledge.'] }
};
const OBJECTIVES = [
    'To work in a growth-oriented organization where I can use my skills and contribute to its success while learning and growing.',
    'Seeking a challenging position that lets me apply my knowledge, work with a team and build a long-term career.',
    'To secure a responsible role where my hard work, honesty and willingness to learn can add value to the company.'
];
const FONTS = {
    'Poppins':         "'Poppins', sans-serif",
    'Roboto':          "'Roboto', sans-serif",
    'Montserrat':      "'Montserrat', sans-serif",
    'Nunito':          "'Nunito', sans-serif",
    'Lora (serif)':    "'Lora', Georgia, serif",
    'Merriweather':    "'Merriweather', Georgia, serif",
    'Times New Roman': "'Times New Roman', Times, serif",
    'Arial':           "Arial, Helvetica, sans-serif"
};
const SIZES = { '11': 'Small', '12.5': 'Medium', '14': 'Large', '15': 'Extra large' };
const SWATCHES = ['#1c2230', '#0b6efd', '#0f766e', '#7c3aed', '#c2410c', '#be123c'];
const KEY = 'resume-builder-v1';

/* ================= state ================= */
function defaults() {
    return {
        heading: 'RESUME',
        order: ['basic', 'objective', 'qualification', 'other', 'work', 'personal'],
        basicOrder: Object.keys(BASIC),
        personalOrder: Object.keys(PERSONAL),
        basic: {},
        personal: { gender: 'Male', marital: 'Single' },
        objective: '',
        qual: [{ q: '', u: '', y: '', p: '' }],
        other: [''],
        work: [''],
        custom: {},   // user-made sections
        cf: {},       // user-made fields (labels)
        seq: 0,
        photo: '',
        design: { font: 'Poppins', size: '12.5', accent: '#1c2230', style: 'line', photo: 'square' },
        footer: { show: true, place: '', date: '' }
    };
}

let state = load();

function load() {
    const d = defaults();
    try {
        const saved = JSON.parse(localStorage.getItem(KEY) || 'null');
        if (saved && typeof saved === 'object') {
            const s = Object.assign(d, saved);
            s.design = Object.assign(defaults().design, saved.design || {});
            s.footer = Object.assign(defaults().footer, saved.footer || {});
            s.cf = s.cf || {};
            s.custom = s.custom || {};
            // deleted things stay deleted: only drop ids that no longer exist
            s.order = (s.order || []).filter(id => TITLES[id] || s.custom[id]);
            s.basicOrder = (s.basicOrder || []).filter(k => BASIC[k] || s.cf[k]);
            s.personalOrder = (s.personalOrder || []).filter(k => PERSONAL[k] || s.cf[k]);
            if (!Array.isArray(s.qual) || !s.qual.length) s.qual = defaults().qual;
            if (!Array.isArray(s.other) || !s.other.length) s.other = [''];
            if (!Array.isArray(s.work) || !s.work.length) s.work = [''];
            return s;
        }
    } catch (e) { /* storage unavailable or corrupt: start fresh */ }
    return d;
}
let saveTimer = null;
function save() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
        try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* ignore */ }
    }, 250);
}

/* ================= helpers ================= */
function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function move(arr, i, d) {
    const j = i + d;
    if (j < 0 || j >= arr.length) return false;
    [arr[i], arr[j]] = [arr[j], arr[i]];
    return true;
}
function defOf(key) {
    if (BASIC[key]) return BASIC[key];
    if (PERSONAL[key]) return PERSONAL[key];
    const label = (state.cf[key] && state.cf[key].label) || 'Custom field';
    return { label, short: label, custom: true };
}
function getList(name) {
    if (name === 'sections') return state.order;
    if (name.startsWith('custom:')) return state.custom[name.slice(7)].points;
    return state[name];
}
function blankFor(name) { return name === 'qual' ? { q: '', u: '', y: '', p: '' } : ''; }
function bindFor(name, i) {
    if (name === 'qual') return `qual.${i}.q`;
    if (name.startsWith('custom:')) return `custom.${name.slice(7)}.points.${i}`;
    return `${name}.${i}`;
}
function setPath(path, val) {
    const parts = path.split('.');
    let o = state;
    for (let i = 0; i < parts.length - 1; i++) o = o[parts[i]];
    o[parts[parts.length - 1]] = val;
}
function moveBtns(list, i, n) {
    return `<button type="button" data-act="move" data-list="${list}" data-i="${i}" data-d="-1" ${i === 0 ? 'disabled' : ''} aria-label="Move up" title="Move up">▲</button>`
         + `<button type="button" data-act="move" data-list="${list}" data-i="${i}" data-d="1" ${i === n - 1 ? 'disabled' : ''} aria-label="Move down" title="Move down">▼</button>`;
}
function inkFor(hex) {
    const m = /^#?([0-9a-f]{6})$/i.exec(hex || '');
    if (!m) return '#fff';
    const v = parseInt(m[1], 16);
    const lum = (0.299 * (v >> 16) + 0.587 * ((v >> 8) & 255) + 0.114 * (v & 255)) / 255;
    return lum > 0.62 ? '#111' : '#fff';
}

/* ================= form rendering ================= */
function fieldHtml(group, key, i, n) {
    const def = defOf(key);
    const store = group === 'basic' ? state.basic : state.personal;
    const listName = group === 'basic' ? 'basicOrder' : 'personalOrder';
    const val = store[key] || '';
    const bind = `${group}.${key}`;
    let control;
    if (def.options) {
        control = `<select data-bind="${bind}">${def.options.map(o => `<option ${o === val ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>`;
    } else {
        control = `<input type="${def.type || 'text'}" data-bind="${bind}" value="${esc(val)}" placeholder="${esc(def.ph || '')}">`;
    }
    const labelHtml = def.custom
        ? `<input class="lbl-in" data-bind="cf.${key}.label" value="${esc(def.label)}" aria-label="Field name">`
        : `<label>${esc(def.label)}${def.req ? ' <span class="req">*</span>' : ''}</label>`;
    return `<div class="field">
        <div class="lbl">${labelHtml}<span class="mv">${moveBtns(listName, i, n)}<button type="button" class="danger" data-act="delfield" data-group="${group}" data-key="${key}" aria-label="Delete field" title="Delete field">✕</button></span></div>
        ${control}
    </div>`;
}

function addFieldRow(group) {
    const std = group === 'basic' ? BASIC : PERSONAL;
    const order = group === 'basic' ? state.basicOrder : state.personalOrder;
    const removed = Object.keys(std).filter(k => !order.includes(k));
    return `<div class="addrow">
        <select data-addfield="${group}">
            ${removed.map(k => `<option value="${k}">Restore: ${esc(std[k].label)}</option>`).join('')}
            <option value="__custom">+ New custom field</option>
        </select>
        <button type="button" class="btn-line" data-act="addfield" data-group="${group}">Add field</button>
    </div>`;
}

function pointsBody(list) {
    const arr = getList(list);
    const rows = arr.map((v, i) => `
        <div class="prow">
            <input type="text" data-bind="${bindFor(list, i)}" value="${esc(v)}" placeholder="${list === 'other' ? 'Basic Knowledge of Computer' : 'Write a point'}">
            <span class="mv">${moveBtns(list, i, arr.length)}<button type="button" class="danger" data-act="del" data-list="${list}" data-i="${i}" aria-label="Remove" title="Remove">✕</button></span>
        </div>`).join('');
    return rows + `<button type="button" class="btn-line" data-act="add" data-list="${list}">+ Add Point</button>`;
}

function designHtml() {
    const d = state.design;
    return `<section class="card">
        <div class="card-head"><h2>Design</h2><button type="button" class="btn-line" data-act="sample">Fill sample data</button></div>
        <div class="dgrid">
            <div class="field"><div class="lbl"><label>Font</label></div>
                <select data-bind="design.font">${Object.keys(FONTS).map(f => `<option ${f === d.font ? 'selected' : ''}>${esc(f)}</option>`).join('')}</select></div>
            <div class="field"><div class="lbl"><label>Text size</label></div>
                <select data-bind="design.size">${Object.keys(SIZES).map(s => `<option value="${s}" ${s === String(d.size) ? 'selected' : ''}>${SIZES[s]}</option>`).join('')}</select></div>
            <div class="field"><div class="lbl"><label>Accent colour</label></div>
                <div class="swatches">
                    ${SWATCHES.map(c => `<button type="button" data-act="accent" data-v="${c}" style="background:${c}" class="${c.toLowerCase() === String(d.accent).toLowerCase() ? 'on' : ''}" aria-label="Colour ${c}"></button>`).join('')}
                    <input type="color" data-bind="design.accent" value="${esc(d.accent)}" aria-label="Custom colour">
                </div></div>
            <div class="field"><div class="lbl"><label>Section titles</label></div>
                <select data-bind="design.style"><option value="line" ${d.style === 'line' ? 'selected' : ''}>Underline</option><option value="bar" ${d.style === 'bar' ? 'selected' : ''}>Filled bar</option></select></div>
            <div class="field"><div class="lbl"><label>Photo shape</label></div>
                <select data-bind="design.photo"><option value="square" ${d.photo === 'square' ? 'selected' : ''}>Square</option><option value="round" ${d.photo === 'round' ? 'selected' : ''}>Round</option></select></div>
        </div>
    </section>`;
}

function sectionBody(id) {
    if (id === 'basic') {
        const n = state.basicOrder.length;
        return `<div class="field"><div class="lbl"><label>Heading <span class="req">*</span></label></div>
            <select data-bind="heading">${['RESUME', 'CV', 'BIO-DATA', 'CURRICULUM VITAE'].map(o => `<option ${o === state.heading ? 'selected' : ''}>${o}</option>`).join('')}</select></div>`
            + state.basicOrder.map((k, i) => fieldHtml('basic', k, i, n)).join('')
            + addFieldRow('basic')
            + `<div class="photo-row">
                ${state.photo ? `<img src="${esc(state.photo)}" alt="Profile picture">` : `<svg width="84" height="96" viewBox="0 0 84 96" aria-hidden="true"><rect width="84" height="96" rx="6" fill="#e8eaee"/><circle cx="42" cy="36" r="15" fill="#aeb3bd"/><path d="M12 96c0-20 13-30 30-30s30 10 30 30z" fill="#aeb3bd"/></svg>`}
                <div><button type="button" class="btn-grey" data-act="photo">Upload Profile Picture</button>
                ${state.photo ? ' <button type="button" class="btn-line" data-act="photo-clear">Remove photo</button>' : ''}
                <input type="file" id="photoInput" accept="image/*" hidden></div>
            </div>`;
    }
    if (id === 'objective') {
        return `<select data-preset><option value="">Select Objective</option>${OBJECTIVES.map((o, i) => `<option value="${i}">${esc(o.slice(0, 70))}…</option>`).join('')}</select>
            <textarea data-bind="objective" id="objText" placeholder="Write your career objective">${esc(state.objective)}</textarea>`;
    }
    if (id === 'qualification') {
        const n = state.qual.length;
        return state.qual.map((r, i) => `
            <div class="qrow">
                <input type="text" data-bind="qual.${i}.q" value="${esc(r.q)}" placeholder="Qualification*">
                <input type="text" data-bind="qual.${i}.u" value="${esc(r.u)}" placeholder="University / Board*">
                <input type="text" data-bind="qual.${i}.y" value="${esc(r.y)}" placeholder="Year*">
                <input type="text" data-bind="qual.${i}.p" value="${esc(r.p)}" placeholder="Per %*">
                <span class="mv">${moveBtns('qual', i, n)}<button type="button" class="rm" data-act="del" data-list="qual" data-i="${i}">Remove</button></span>
            </div>`).join('')
            + `<button type="button" class="btn-line" data-act="add" data-list="qual">+ Add More</button>`;
    }
    if (id === 'other') return pointsBody('other');
    if (id === 'work') return pointsBody('work');
    if (id === 'personal') {
        const n = state.personalOrder.length;
        return state.personalOrder.map((k, i) => fieldHtml('personal', k, i, n)).join('') + addFieldRow('personal');
    }
    return pointsBody('custom:' + id);
}

function todayIso() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function footerHtml() {
    const f = state.footer;
    return `<section class="card">
        <div class="card-head"><h2>Resume footer</h2></div>
        <div class="field"><label style="font-weight:600;font-size:13px;display:flex;gap:8px;align-items:center;cursor:pointer">
            <input type="checkbox" data-bind="footer.show" ${f.show ? 'checked' : ''} style="width:auto"> Show Place, Date and Name at the end of the resume</label></div>
        <div class="dgrid">
            <div class="field"><div class="lbl"><label>Place</label></div>
                <input type="text" data-bind="footer.place" value="${esc(f.place)}" placeholder="Leave empty to use your State / City"></div>
            <div class="field"><div class="lbl"><label>Date</label></div>
                <input type="date" data-bind="footer.date" value="${esc(f.date)}"></div>
        </div>
        <div style="font-size:12px;color:var(--dim)">Date empty = today's date. Name comes from the Full Name field and is printed in capital letters.</div>
    </section>`;
}

function addSectionBar() {
    const removedDefaults = Object.keys(TITLES).filter(id => !state.order.includes(id));
    return `<div class="addbar">
        <div class="t">Add a section</div>
        <div class="addrow">
            <select data-addsec>
                ${removedDefaults.map(id => `<option value="def:${id}">Restore: ${TITLES[id]}</option>`).join('')}
                ${Object.keys(PRESETS).map(k => `<option value="pre:${k}">${PRESETS[k].label}</option>`).join('')}
                <option value="blank">Blank section (my own title)</option>
            </select>
            <button type="button" class="btn-line" data-act="addsec">Add section</button>
        </div>
    </div>`;
}

function formHtml() {
    const n = state.order.length;
    const cards = state.order.map((id, i) => {
        const isCustom = !!state.custom[id];
        const head = isCustom
            ? `<input class="title-in" data-bind="custom.${id}.title" value="${esc(state.custom[id].title)}" aria-label="Section title">`
            : `<h2>${TITLES[id]}</h2>`;
        return `<section class="card" data-sec="${id}">
            <div class="card-head">${head}<span class="mv">${moveBtns('sections', i, n)}<button type="button" class="danger" data-act="delsec" data-id="${id}" aria-label="Delete section" title="Delete section">✕</button></span></div>
            ${sectionBody(id)}
        </section>`;
    }).join('');
    return designHtml() + cards + footerHtml() + addSectionBar() + `
        <div id="msg" role="alert"></div>
        <button type="button" class="btn-wide blue" data-act="create">Create Resume</button>`;
}

/* ================= preview rendering ================= */
function fmtDate(v) { return v ? v.split('-').reverse().join('-') : ''; }

function previewHtml() {
    const round = state.design.photo === 'round' ? ' round' : '';
    let out = `<div class="p-heading">${esc(state.heading)}</div>`;
    let any = false;
    state.order.forEach(id => {
        if (id === 'basic') {
            let lines = '';
            state.basicOrder.forEach(k => {
                const v = (state.basic[k] || '').trim();
                if (!v) return;
                if (k === 'name') lines += `<div class="p-name">${esc(v)}</div>`;
                else if (k === 'profile') lines += `<div class="p-role">${esc(v)}</div>`;
                else lines += `<div class="p-line"><b>${esc(defOf(k).short)}:</b> ${esc(v)}</div>`;
            });
            if (lines || state.photo) {
                out += `<div class="p-head"><div>${lines}</div>${state.photo ? `<img class="p-photo${round}" src="${esc(state.photo)}" alt="">` : ''}</div>`;
                any = true;
            }
        } else if (id === 'objective') {
            if (state.objective.trim()) { any = true; out += `<div class="p-sec"><h3>${TITLES[id]}</h3><p>${esc(state.objective)}</p></div>`; }
        } else if (id === 'qualification') {
            const rows = state.qual.filter(r => r.q || r.u || r.y || r.p);
            if (rows.length) {
                any = true;
                out += `<div class="p-sec"><h3>${TITLES[id]}</h3><table><tr><th>Qualification</th><th>University / Board</th><th>Year</th><th>Per %</th></tr>`
                    + rows.map(r => `<tr><td>${esc(r.q)}</td><td>${esc(r.u)}</td><td>${esc(r.y)}</td><td>${esc(r.p)}</td></tr>`).join('') + `</table></div>`;
            }
        } else if (id === 'other' || id === 'work') {
            const pts = state[id].filter(p => p.trim());
            if (pts.length) { any = true; out += `<div class="p-sec"><h3>${TITLES[id]}</h3><ul>${pts.map(p => `<li>${esc(p)}</li>`).join('')}</ul></div>`; }
        } else if (id === 'personal') {
            let rows = '';
            state.personalOrder.forEach(k => {
                let v = (state.personal[k] || '').trim();
                if (k === 'dob') v = fmtDate(v);
                if (v) rows += `<tr><td class="k">${esc(defOf(k).label)}</td><td class="v">: ${esc(v)}</td></tr>`;
            });
            if (rows) { any = true; out += `<div class="p-sec"><h3>${TITLES[id]}</h3><table>${rows}</table></div>`; }
        } else if (state.custom[id]) {
            const c = state.custom[id];
            const pts = c.points.filter(p => p.trim());
            if (pts.length) { any = true; out += `<div class="p-sec"><h3>${esc(c.title || 'Section')}</h3><ul>${pts.map(p => `<li>${esc(p)}</li>`).join('')}</ul></div>`; }
        }
    });
    if (!any) {
        out += `<div class="p-empty">Start filling the form — your resume appears here.</div>`;
    } else if (state.footer.show) {
        const f = state.footer;
        const place = (f.place || '').trim() || (state.basic.city || '').trim();
        const date = fmtDate(f.date || todayIso());
        const name = (state.basic.name || '').trim().toUpperCase();
        out += `<div class="p-foot">
            <div class="l"><div><b>Place:</b> ${esc(place)}</div><div><b>Date:</b> ${esc(date)}</div></div>
            <div class="r">${name ? `<div class="sig">${esc(name)}</div>` : ''}</div>
        </div>`;
    }
    return out;
}

/* ================= render + events ================= */
const formEl = document.getElementById('form');
const paperEl = document.getElementById('paper');

function applyDesign() {
    const d = state.design;
    paperEl.style.fontFamily = FONTS[d.font] || FONTS['Poppins'];
    paperEl.style.fontSize = (parseFloat(d.size) || 12.5) + 'px';
    paperEl.style.setProperty('--acc', d.accent);
    paperEl.style.setProperty('--acc-ink', inkFor(d.accent));
    paperEl.className = 'paper' + (d.style === 'bar' ? ' s-bar' : '');
}
function renderForm() { formEl.innerHTML = formHtml(); }
function renderPreview() { applyDesign(); paperEl.innerHTML = previewHtml(); }
function renderAll() { renderForm(); renderPreview(); save(); }

function focusAfter(list, idx, d) {
    const q = dd => document.querySelector(`[data-act="move"][data-list="${list}"][data-i="${idx}"][data-d="${dd}"]:not([disabled])`);
    const el = q(d) || q(-d);
    if (el) el.focus();
}

function fillSample() {
    Object.assign(state.basic, {
        name: 'Rahul Sharma', house: 'H.No. 24', landmark: 'Near Shiv Mandir', area: 'Sector 12',
        city: 'Jaipur, Rajasthan', pincode: '302001', mobile: '9876543210', email: 'rahul.sharma@example.com', profile: 'Computer Operator'
    });
    Object.assign(state.personal, { gender: 'Male', father: 'Mr. Mohan Sharma', dob: '1999-08-15', lang: 'Hindi & English', nationality: 'Indian', marital: 'Single' });
    state.objective = OBJECTIVES[0];
    state.qual = [
        { q: 'B.Com', u: 'University of Rajasthan', y: '2021', p: '68%' },
        { q: '12th', u: 'RBSE', y: '2018', p: '72%' },
        { q: '10th', u: 'RBSE', y: '2016', p: '75%' }
    ];
    state.other = ['Basic Knowledge of Computer', 'MS Office, Typing (Hindi & English)'];
    state.work = ['Data entry operator at ABC Services (2 years)'];
}

formEl.addEventListener('click', e => {
    const b = e.target.closest('[data-act]');
    if (!b || b.disabled) return;
    const act = b.dataset.act;
    const list = b.dataset.list;
    const i = Number(b.dataset.i);

    if (act === 'move') {
        const d = Number(b.dataset.d);
        if (move(getList(list), i, d)) { renderAll(); focusAfter(list, i + d, d); }
    } else if (act === 'del') {
        const arr = getList(list);
        arr.splice(i, 1);
        if (!arr.length) arr.push(blankFor(list));
        renderAll();
    } else if (act === 'add') {
        const arr = getList(list);
        arr.push(blankFor(list));
        renderAll();
        const el = document.querySelector(`[data-bind="${bindFor(list, arr.length - 1)}"]`);
        if (el) el.focus();
    } else if (act === 'delfield') {
        const key = b.dataset.key;
        const order = b.dataset.group === 'basic' ? state.basicOrder : state.personalOrder;
        const idx = order.indexOf(key);
        if (idx > -1) order.splice(idx, 1);
        if (state.cf[key]) {           // custom fields are removed for good, standard ones can be restored
            delete state.cf[key];
            delete state.basic[key];
            delete state.personal[key];
        }
        renderAll();
    } else if (act === 'addfield') {
        const group = b.dataset.group;
        const sel = document.querySelector(`[data-addfield="${group}"]`);
        const val = sel ? sel.value : '__custom';
        const order = group === 'basic' ? state.basicOrder : state.personalOrder;
        let focusBind = null;
        if (val === '__custom') {
            const id = 'x' + (++state.seq);
            state.cf[id] = { label: 'New field' };
            order.push(id);
            focusBind = `cf.${id}.label`;
        } else if (!order.includes(val)) {
            order.push(val);
            focusBind = `${group}.${val}`;
        }
        renderAll();
        const el = focusBind && document.querySelector(`[data-bind="${focusBind}"]`);
        if (el) { el.focus(); if (el.select && val === '__custom') el.select(); }
    } else if (act === 'addsec') {
        const sel = document.querySelector('[data-addsec]');
        const val = sel ? sel.value : 'blank';
        let focusBind = null;
        if (val.startsWith('def:')) {
            const id = val.slice(4);
            if (!state.order.includes(id)) state.order.push(id);
        } else {
            const id = 'c' + (++state.seq);
            const preset = PRESETS[val.slice(4)];
            state.custom[id] = preset
                ? { title: preset.label, points: preset.points.slice() }
                : { title: 'New Section', points: [''] };
            state.order.push(id);
            focusBind = `custom.${id}.${preset ? 'points.0' : 'title'}`;
        }
        renderAll();
        const el = focusBind && document.querySelector(`[data-bind="${focusBind}"]`);
        if (el) {
            if (el.scrollIntoView) el.scrollIntoView({ block: 'center' });
            el.focus();
            if (el.select && focusBind.endsWith('.title')) el.select();
        }
    } else if (act === 'delsec') {
        const id = b.dataset.id;
        state.order = state.order.filter(x => x !== id);
        if (state.custom[id]) delete state.custom[id];   // default sections keep their data and can be restored
        renderAll();
    } else if (act === 'accent') {
        state.design.accent = b.dataset.v;
        renderAll();
    } else if (act === 'sample') {
        if (confirm('Fill the form with sample data? This replaces what you typed in the standard fields.')) { fillSample(); renderAll(); }
    } else if (act === 'photo') {
        const input = document.getElementById('photoInput');
        if (input) input.click();
    } else if (act === 'photo-clear') {
        state.photo = '';
        renderAll();
    } else if (act === 'create') {
        createResume();
    }
});

formEl.addEventListener('input', e => {
    const t = e.target;
    if (t.dataset && t.dataset.bind) {
        setPath(t.dataset.bind, t.type === 'checkbox' ? t.checked : t.value);
        if (t.classList) t.classList.remove('invalid');
        if (t.dataset.bind === 'design.accent') {
            // keep the swatch highlight in sync without rebuilding the form while the picker is open
            formEl.querySelectorAll && formEl.querySelectorAll('.swatches button').forEach(sw => sw.classList.remove('on'));
        }
        renderPreview();
        save();
    }
});

formEl.addEventListener('change', e => {
    const t = e.target;
    if (t.dataset && t.dataset.preset !== undefined) {
        if (t.value !== '') {
            state.objective = OBJECTIVES[Number(t.value)];
            const ta = document.getElementById('objText');
            if (ta) ta.value = state.objective;
            renderPreview();
            save();
        }
    } else if (t.id === 'photoInput' && t.files && t.files[0]) {
        const reader = new FileReader();
        reader.onload = () => { state.photo = String(reader.result); renderAll(); };
        reader.readAsDataURL(t.files[0]);
    } else if (t.dataset && t.dataset.bind) {
        setPath(t.dataset.bind, t.type === 'checkbox' ? t.checked : t.value);
        renderPreview();
        save();
    }
});

function createResume() {
    const missing = [];
    state.basicOrder.forEach(k => { const d = defOf(k); if (d.req && !(state.basic[k] || '').trim()) missing.push({ label: d.label, bind: `basic.${k}` }); });
    state.personalOrder.forEach(k => { const d = defOf(k); if (d.req && !(state.personal[k] || '').trim()) missing.push({ label: d.label, bind: `personal.${k}` }); });
    const msg = document.getElementById('msg');
    if (missing.length) {
        msg.textContent = 'Please fill: ' + missing.map(m => m.label).join(', ') + '. You can also delete fields you do not need.';
        msg.classList.add('show');
        missing.forEach(m => { const el = document.querySelector(`[data-bind="${m.bind}"]`); if (el) el.classList.add('invalid'); });
        const first = document.querySelector(`[data-bind="${missing[0].bind}"]`);
        if (first) first.focus();
        return;
    }
    msg.classList.remove('show');
    window.print();
}

document.getElementById('printBtn').addEventListener('click', () => window.print());
document.getElementById('resetBtn').addEventListener('click', () => {
    if (confirm('Clear everything and start a new resume?')) {
        state = defaults();
        try { localStorage.removeItem(KEY); } catch (e) { /* ignore */ }
        renderAll();
    }
});

renderAll();
</script>
</body>
</html>
