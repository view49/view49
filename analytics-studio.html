<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics Studio Auto - Real YouTube Data</title>
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-card: #1a1a24;
            --border-color: #2a2a3a;
            --text-primary: #f0f0f5;
            --text-secondary: #a0a0b0;
            --accent-red: #ff3b30;
            --accent-blue: #007aff;
            --accent-green: #34c759;
            --accent-purple: #af52de;
            --accent-gold: #ffcc00;
            --glow-red: 0 0 20px rgba(255, 59, 48, 0.3);
            --glow-blue: 0 0 20px rgba(0, 122, 255, 0.3);
            --glow-green: 0 0 20px rgba(52, 199, 89, 0.3);
            --glow-gold: 0 0 20px rgba(255, 204, 0, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            background-image: 
                radial-gradient(ellipse at 1% 1%, rgba(255, 59, 48, 0.1) 0%, transparent 50%),
                radial-gradient(ellipse at 99% 1%, rgba(0, 122, 255, 0.1) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 100%, rgba(52, 199, 89, 0.05) 0%, transparent 50%);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            padding: 40px 0;
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 800px;
            height: 300px;
            background: radial-gradient(ellipse, rgba(255, 59, 48, 0.15) 0%, transparent 70%);
            filter: blur(100px);
            z-index: 0;
        }

        .header-content {
            position: relative;
            z-index: 1;
        }

        .logo {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 10px 24px;
            background: linear-gradient(135deg, var(--accent-red), var(--accent-purple));
            border-radius: 50px;
            box-shadow: var(--glow-red);
            margin-bottom: 20px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        .logo-icon {
            font-size: 24px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.05); }
        }

        .logo-text {
            font-weight: 700;
            font-size: 18px;
            letter-spacing: 1px;
        }

        h1 {
            font-size: clamp(2.5rem, 8vw, 4rem);
            font-weight: 800;
            background: linear-gradient(135deg, #fff, var(--accent-blue), var(--accent-gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 12px;
            line-height: 1.1;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 16px;
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.6;
        }

        .input-section {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            display: block;
        }

        input[type="text"], input[type="url"] {
            width: 100%;
            padding: 14px 18px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            color: var(--text-primary);
            font-size: 15px;
            transition: all 0.3s ease;
            outline: none;
        }

        input[type="text"]:focus, input[type="url"]:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.1);
        }

        input::placeholder {
            color: var(--text-secondary);
        }

        .btn {
            padding: 16px 32px;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            border: none;
            border-radius: 14px;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            box-shadow: var(--glow-blue);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 122, 255, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-icon {
            font-size: 18px;
        }

        .btn-secondary {
            background: linear-gradient(135deg, var(--accent-gold), #ffd700);
            box-shadow: var(--glow-gold);
        }

        .btn-secondary:hover {
            box-shadow: 0 10px 30px rgba(255, 204, 0, 0.4);
        }

        .status {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            color: var(--text-secondary);
            min-height: 24px;
        }

        .loading {
            display: none;
            text-align: center;
            margin: 20px 0;
        }

        .spinner {
            border: 3px solid var(--bg-secondary);
            border-top: 3px solid var(--accent-blue);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .results-section {
            display: none;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 18px;
            padding: 24px;
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--accent-red), var(--accent-blue));
        }

        .stat-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 4px;
        }

        .stat-value.green {
            color: var(--accent-green);
            text-shadow: var(--glow-green);
        }

        .stat-value.red {
            color: var(--accent-red);
            text-shadow: var(--glow-red);
        }

        .stat-value.blue {
            color: var(--accent-blue);
            text-shadow: var(--glow-blue);
        }

        .stat-value.gold {
            color: var(--accent-gold);
            text-shadow: var(--glow-gold);
        }

        .stat-growth {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .stat-growth.positive {
            color: var(--accent-green);
        }

        .stat-growth.negative {
            color: var(--accent-red);
        }

        .channel-info {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 18px;
            padding: 25px;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .channel-thumbnail {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--accent-blue);
            box-shadow: var(--glow-blue);
        }

        .channel-details h3 {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 5px;
        }

        .channel-details p {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 5px;
        }

        .channel-stats {
            display: flex;
            gap: 20px;
            margin-top: 10px;
        }

        .channel-stat {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .channel-stat-value {
            font-weight: 700;
            color: var(--accent-blue);
        }

        .chart-section {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 18px;
            padding: 25px;
            margin-bottom: 30px;
        }

        .chart-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .chart-title::before {
            content: '';
            width: 4px;
            height: 20px;
            background: linear-gradient(180deg, var(--accent-red), var(--accent-blue));
            border-radius: 2px;
        }

        .bar-chart {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .bar-item {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .bar-label {
            width: 120px;
            font-size: 13px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .bar-track {
            flex: 1;
            height: 12px;
            background: var(--bg-secondary);
            border-radius: 6px;
            overflow: hidden;
            position: relative;
        }

        .bar-fill {
            height: 100%;
            border-radius: 6px;
            transition: width 0.5s ease;
            position: relative;
        }

        .bar-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2));
            border-radius: 6px;
        }

        .bar-value {
            width: 100px;
            text-align: right;
            font-size: 14px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .projection-section {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 18px;
            padding: 25px;
        }

        .projection-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .projection-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
        }

        .projection-item {
            text-align: center;
            padding: 15px;
            background: var(--bg-secondary);
            border-radius: 12px;
        }

        .projection-time {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .projection-value {
            font-size: 20px;
            font-weight: 700;
            color: var(--accent-blue);
        }

        .projection-subtitle {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .disclaimer {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
            text-align: center;
            line-height: 1.5;
        }

        .feature-badge {
            display: inline-block;
            padding: 6px 12px;
            background: rgba(0, 122, 255, 0.1);
            border: 1px solid rgba(0, 122, 255, 0.3);
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            color: var(--accent-blue);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .manual-toggle {
            text-align: center;
            margin-top: 15px;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .manual-toggle button {
            background: none;
            border: none;
            color: var(--accent-blue);
            cursor: pointer;
            text-decoration: underline;
            font-size: 13px;
        }

        .manual-toggle button:hover {
            color: var(--accent-gold);
        }

        .manual-form {
            display: none;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
        }

        .error-message {
            color: var(--accent-red) !important;
            font-weight: 600 !important;
        }

        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }

            .results-grid {
                grid-template-columns: 1fr;
            }

            .bar-label {
                width: 80px;
                font-size: 12px;
            }

            .bar-value {
                width: 80px;
                font-size: 13px;
            }

            .channel-info {
                flex-direction: column;
                text-align: center;
            }

            .channel-stats {
                flex-wrap: wrap;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-content">
                <div class="logo">
                    <span class="logo-icon">🚀</span>
                    <span class="logo-text">Analytics Studio Auto</span>
                </div>
                <h1>Smart YouTube Growth Analyzer</h1>
                <p class="subtitle">Paste your YouTube channel URL below and let our AI automatically fetch and analyze your real growth metrics!</p>
                <span class="feature-badge">✨ Real YouTube Data API</span>
            </div>
        </div>

        <div class="input-section">
            <div class="input-group">
                <label class="input-label">Channel URL</label>
                <input id="channelUrl" type="url" placeholder="https://www.youtube.com/@YourChannel or https://www.youtube.com/c/YourChannel" />
            </div>
            <button class="btn" onclick="fetchChannelData()">
                <span class="btn-icon">🔍</span>
                <span>Analyze Channel</span>
            </button>
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <div>Fetching your real YouTube channel data...</div>
            </div>
            <div id="statusMessage" class="status"></div>
            
            <div class="manual-toggle">
                <p>Prefer manual entry? <button onclick="toggleManualForm()">Click here</button></p>
            </div>
            
            <div class="manual-form" id="manualForm">
                <div class="input-group">
                    <label class="input-label">Starting Point</label>
                    <input id="startSubs" type="number" placeholder="Subscribers" />
                    <input id="startViews" type="number" placeholder="Total Views" />
                </div>
                <div class="input-group">
                    <label class="input-label">Current Point</label>
                    <input id="endSubs" type="number" placeholder="Subscribers" />
                    <input id="endViews" type="number" placeholder="Total Views" />
                </div>
                <input id="daysBetween" type="number" placeholder="Days between these two points (e.g., 30)" />
                <button class="btn btn-secondary" onclick="calculateManual()">
                    <span class="btn-icon">📈</span>
                    <span>Calculate Growth</span>
                </button>
            </div>
        </div>

        <div id="resultArea" class="results-section"></div>
    </div>

    <script>
        const API_KEY = "AIzaSyAaqsgyR83k4BMGcIOBwjPg-n9g0EHvhnE";

        function toggleManualForm() {
            const manualForm = document.getElementById('manualForm');
            if (manualForm.style.display === 'block') {
                manualForm.style.display = 'none';
            } else {
                manualForm.style.display = 'block';
            }
        }

        function extractChannelId(url) {
            // Handle different YouTube URL formats
            if (url.includes("youtube.com/c/")) {
                // Handle /c/username URLs
                const parts = url.split("/c/");
                if (parts.length > 1) {
                    const username = parts[1].split("/")[0];
                    return username;
                }
            } else if (url.includes("youtube.com/@")) {
                // Handle @username URLs
                const parts = url.split("@");
                if (parts.length > 1) {
                    const username = parts[1].split("/")[0];
                    return username;
                }
            } else if (url.includes("youtube.com/channel/")) {
                // Handle /channel/UC... IDs
                const parts = url.split("/channel/");
                if (parts.length > 1) {
                    const channelId = parts[1].split("/")[0];
                    return channelId;
                }
            } else if (url.includes("youtube.com/user/")) {
                // Handle /user/username URLs
                const parts = url.split("/user/");
                if (parts.length > 1) {
                    const username = parts[1].split("/")[0];
                    return username;
                }
            }
            return null;
        }

        async function fetchChannelData() {
            const channelUrl = document.getElementById("channelUrl").value.trim();
            const status = document.getElementById("statusMessage");
            const loading = document.getElementById("loading");
            const results = document.getElementById("resultArea");

            if (!channelUrl) {
                status.innerHTML = '<span class="error-message">⚠️ Please enter a YouTube channel URL.</span>';
                results.style.display = "none";
                return;
            }

            // Show loading
            loading.style.display = "block";
            status.innerHTML = "";
            results.style.display = "none";

            try {
                const channelIdentifier = extractChannelId(channelUrl);
                if (!channelIdentifier) {
                    throw new Error("Invalid YouTube channel URL");
                }

                // First, try to get channel details
                const channelResponse = await fetch(
                    `https://www.googleapis.com/youtube/v3/channels?part=snippet,statistics&forUsername=${channelIdentifier}&key=${API_KEY}`
                );
                
                let channelData = await channelResponse.json();
                
                // If no channel found with username, try as channel ID
                if (!channelData.items || channelData.items.length === 0) {
                    const channelIdResponse = await fetch(
                        `https://www.googleapis.com/youtube/v3/channels?part=snippet,statistics&id=${channelIdentifier}&key=${API_KEY}`
                    );
                    channelData = await channelIdResponse.json();
                }

                if (!channelData.items || channelData.items.length === 0) {
                    throw new Error("Channel not found. Please check the URL.");
                }

                const channel = channelData.items[0];
                const channelId = channel.id;
                const channelName = channel.snippet.title;
                const channelThumbnail = channel.snippet.thumbnails.high.url;
                const subscriberCount = parseInt(channel.statistics.subscriberCount);
                const viewCount = parseInt(channel.statistics.viewCount);
                const videoCount = parseInt(channel.statistics.videoCount);

                // Get uploads playlist ID
                const uploadsPlaylistId = channel.contentDetails.relatedPlaylists.uploads;
                
                // Get recent videos to calculate growth
                const videosResponse = await fetch(
                    `https://www.googleapis.com/youtube/v3/playlistItems?part=snippet&playlistId=${uploadsPlaylistId}&maxResults=50&key=${API_KEY}`
                );
                const videosData = await videosResponse.json();
                
                // Calculate growth metrics
                const now = new Date();
                let oldestVideoDate = now;
                let newestVideoDate = now;
                let totalViewsFromVideos = 0;
                
                if (videosData.items && videosData.items.length > 0) {
                    const videoIds = videosData.items.map(item => item.snippet.resourceId.videoId).join(",");
                    
                    const videoStatsResponse = await fetch(
                        `https://www.googleapis.com/youtube/v3/videos?part=statistics,snippet&id=${videoIds}&key=${API_KEY}`
                    );
                    const videoStatsData = await videoStatsResponse.json();
                    
                    videoStatsData.items.forEach(video => {
                        const publishedAt = new Date(video.snippet.publishedAt);
                        const views = parseInt(video.statistics.viewCount) || 0;
                        
                        totalViewsFromVideos += views;
                        
                        if (publishedAt < oldestVideoDate) oldestVideoDate = publishedAt;
                        if (publishedAt > newestVideoDate) newestVideoDate = publishedAt;
                    });
                }

                const daysBetween = Math.floor((newestVideoDate - oldestVideoDate) / (1000 * 60 * 60 * 24)) || 30;
                const avgViewsPerDay = daysBetween > 0 ? Math.floor(totalViewsFromVideos / daysBetween) : 0;
                const avgVideosPerDay = daysBetween > 0 ? (videoCount / ((now - new Date(channel.snippet.publishedAt)) / (1000 * 60 * 60 * 24))) : 0;

                // Display results
                loading.style.display = "none";
                status.innerHTML = '<span style="color: var(--accent-green);">✅ Channel data fetched successfully!</span>';
                displayResults({
                    channelName: channelName,
                    channelThumbnail: channelThumbnail,
                    channelUrl: channelUrl,
                    subscriberCount: subscriberCount,
                    viewCount: viewCount,
                    videoCount: videoCount,
                    publishedAt: channel.snippet.publishedAt,
                    avgViewsPerDay: avgViewsPerDay,
                    avgVideosPerDay: avgVideosPerDay.toFixed(2),
                    daysActive: Math.floor((now - new Date(channel.snippet.publishedAt)) / (1000 * 60 * 60 * 24))
                });

            } catch (error) {
                loading.style.display = "none";
                console.error("Error:", error);
                status.innerHTML = `<span class="error-message">❌ Error: ${error.message}. Please try again or use manual entry.</span>`;
                results.style.display = "none";
            }
        }

        function displayResults(data) {
            const results = document.getElementById("resultArea");
            
            const daysActive = data.daysActive || 1;
            const subsPerDay = (data.subscriberCount / daysActive).toFixed(1);
            const viewsPerDay = data.avgViewsPerDay || Math.floor(data.viewCount / daysActive);
            const videosPerDay = data.avgVideosPerDay || (data.videoCount / daysActive).toFixed(2);

            // Projections
            const proj30Subs = Math.round(data.subscriberCount + (parseFloat(subsPerDay) * 30));
            const proj90Subs = Math.round(data.subscriberCount + (parseFloat(subsPerDay) * 90));
            const proj180Subs = Math.round(data.subscriberCount + (parseFloat(subsPerDay) * 180));
            const proj365Subs = Math.round(data.subscriberCount + (parseFloat(subsPerDay) * 365));

            const proj30Views = Math.round(data.viewCount + (viewsPerDay * 30));
            const proj90Views = Math.round(data.viewCount + (viewsPerDay * 90));
            const proj180Views = Math.round(data.viewCount + (viewsPerDay * 180));
            const proj365Views = Math.round(data.viewCount + (viewsPerDay * 365));

            const growthRate = daysActive > 0 ? ((data.subscriberCount / 1000) / (daysActive / 30)).toFixed(1) : 0;

            results.style.display = "block";
            results.innerHTML = `
                <div class="channel-info">
                    <img src="${data.channelThumbnail}" alt="${data.channelName}" class="channel-thumbnail" onerror="this.src='https://via.placeholder.com/80x80?text=YT'" />
                    <div class="channel-details">
                        <h3>${data.channelName}</h3>
                        <p>YouTube Channel</p>
                        <div class="channel-stats">
                            <div class="channel-stat">
                                <span>👥</span>
                                <span class="channel-stat-value">${data.subscriberCount.toLocaleString()}</span>
                                <span>Subscribers</span>
                            </div>
                            <div class="channel-stat">
                                <span>👁️</span>
                                <span class="channel-stat-value">${data.viewCount.toLocaleString()}</span>
                                <span>Views</span>
                            </div>
                            <div class="channel-stat">
                                <span>🎥</span>

                <div class="results-grid">

                    <div class="stat-card">

                    </div>
                    <div class="stat-card">

                </div>

                <div class="chart-section">
                    <h3 class="chart-title">📈 Daily Performance Metrics</h3>
                    <div class="bar-chart">
                        <div class="bar-item">
                            <span class="bar-label">Subscribers/Day</span>
                            <div class="bar-track">
                                <div class="bar-fill" style="width: ${Math.min(100, parseFloat(subsPerDay) * 2)}%; background: linear-gradient(90deg, var(--accent-red), #ff6b6b);"></div>

                            <span class="bar-value">+${subsPerDay}</span>
                        </div>
                        <div class="bar-item">
                            <span class="bar-label">Views/Day</span>
                            <div class="bar-track">
                                <div class="bar-fill" style="width: ${Math.min(100, viewsPerDay / 1000)}%; background: linear-gradient(90deg, var(--accent-blue), #007aff);"></div>
                            </div>

                        </div>
                        <div class="bar-item">
                            <span class="bar-label">Growth Rate</span>
                            <div class="bar-track">
                                <div class="bar-fill" style="width: ${Math.min(100, parseFloat(growthRate) * 2)}%; background: linear-gradient(90deg, var(--accent-green), #34c759);"></div>

                <div class="projection-section">
                    <h3 class="projection-title">🔮 Smart Growth Projections</h3>
                    <div class="projection-grid">
                        <div class="projection-item">

                        </div>

                        </div>
                        <div class="projection-item">
                            <div class="projection-time">Next 6 Months</div>
                            <div class="projection-value">${proj180Subs.toLocaleString()}</div>
                            <div class="projection-subtitle">subscribers</div>
                        </div>
                        <div class="projection-item">
                            <div class="projection-time">Next Year</div>
                            <div class="projection-value">${proj365Subs.toLocaleString()}</div>
                            <div class="projection-subtitle">subscribers</div>
                        </div>
                    </div>
                    <div class="projection-grid" style="margin-top: 20px;">
                        <div class="projection-item">
                            <div class="projection-time">Next 30 Days</div>
                            <div class="projection-value">${proj30Views.toLocaleString()}</div>
                            <div class="projection-subtitle">views</div>
                        </div>
                        <div class="projection-item">
                            <div class="projection-time">Next 90 Days</div>

                        </div>

                            <div class="projection-time">Next 6 Months</div>
                            <div class="projection-value">${proj180Views.toLocaleString()}</div>
                            <div class="projection-subtitle">views</div>
                        </div>
                        <div class="projection-item">
                            <div class="projection-time">Next Year</div>
                            <div class="projection-value">${proj365Views.toLocaleString()}</div>
                            <div class="projection-subtitle">views</div>
                        </div>
                    </div>
                    <p class="disclaimer">
                        ⚡ These are AI-powered projections based on your current growth rate. 
                        Actual results may vary based on content quality, algorithm changes, and audience engagement.
                    </p>
                </div>
            `;
        }

        function calculateManual() {
            const startSubs = parseFloat(document.getElementById("startSubs").value) || 0;
            const endSubs = parseFloat(document.getElementById("endSubs").value) || 0;
            const startViews = parseFloat(document.getElementById("startViews").value) || 0;
            const endViews = parseFloat(document.getElementById("endViews").value) || 0;
            const days = parseFloat(document.getElementById("daysBetween").value) || 0;

            const status = document.getElementById("statusMessage");
            const results = document.getElementById("resultArea");

            if (days <= 0 || (startSubs === 0 && startViews === 0)) {
                status.innerHTML = '<span class="error-message">⚠️ Please fill in your starting stats and the number of days.</span>';
                results.style.display = "none";
                return;
            }

            const demoData = {
                channelName: "Manual Entry",
                channelThumbnail: "https://via.placeholder.com/80x80?text=YT",
                channelUrl: "#",
                subscriberCount: endSubs,
                viewCount: endViews,
                videoCount: 0,
                publishedAt: new Date().toISOString(),
                avgViewsPerDay: Math.round((endViews - startViews) / days),
                avgVideosPerDay: "0",
                daysActive: days
            };

            status.innerHTML = '<span style="color: var(--accent-green);">✅ Analysis complete!</span>';
            displayResults(demoData);
        }
    </script>
