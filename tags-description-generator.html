<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Tags & Description Generator</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body {
            background: #0b0f19;
            color: #e2e8f0;
            font-family: system-ui, -apple-system, sans-serif;
        }

        .glow-border {
            background: linear-gradient(90deg, #ff0000, #3b82f6);
            padding: 2px;
            border-radius: 18px;
        }

        .custom-card { background: #121826; }

        .result-card {
            background: #121826;
            border: 1px solid #263247;
            border-radius: 16px;
        }

        .tag-pill {
            background: #1e293b;
            border: 1px solid #334155;
            color: #e2e8f0;
            font-size: 12px;
            padding: 6px 12px;
            border-radius: 999px;
            display: inline-block;
            margin: 3px;
        }

        textarea { resize: vertical; }

        #statusMessage { min-height: 20px; }
    </style>
</head>

<body class="min-h-screen p-4">

    <div class="glow-border w-full max-w-4xl mx-auto shadow-2xl">
        <div class="custom-card rounded-2xl p-6 md:p-8">

            <div class="flex justify-between items-center mb-6">
                <span class="bg-red-950/80 text-red-400 border border-red-800/50 text-xs font-bold px-4 py-2 rounded-full">
                    ● SEO Engine 2026
                </span>
                <div class="flex items-center gap-2">
                    <span class="bg-slate-800 text-yellow-400 text-xs font-bold px-3 py-2 rounded-full border border-slate-700">
                        📺 View49
                    </span>
                    <span class="bg-slate-800 text-cyan-400 text-xs font-semibold px-3 py-2 rounded-full border border-slate-700">
                        🏠 HELPVIEW
                    </span>
                </div>
            </div>

            <div class="text-center mb-8">
                <h1 class="text-3xl md:text-5xl font-extrabold text-white mb-3">
                    Tags & Description Generator
                </h1>
                <p class="text-slate-400 text-sm max-w-2xl mx-auto">
                    Enter your video title and a few keywords —
                    get SEO-friendly tags and a ready-to-use description template.
                </p>
            </div>

            <div class="space-y-4">

                <input
                    id="videoTitle"
                    type="text"
                    placeholder="Video title (e.g. How to Edit Videos Like a Pro)"
                    class="w-full bg-[#0d1322] border border-slate-700 rounded-xl px-4 py-4 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-red-500"
                />

                <input
                    id="keywords"
                    type="text"
                    placeholder="Keywords, comma separated (e.g. video editing, premiere pro, tutorial)"
                    class="w-full bg-[#0d1322] border border-slate-700 rounded-xl px-4 py-4 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-red-500"
                />

                <input
                    id="channelName"
                    type="text"
                    placeholder="Channel name (optional, for description)"
                    class="w-full bg-[#0d1322] border border-slate-700 rounded-xl px-4 py-4 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-red-500"
                />

                <button onclick="generateAll()" class="w-full bg-gradient-to-r from-red-600 to-red-500 hover:from-red-700 hover:to-red-600 text-white font-bold px-6 py-3 rounded-xl shadow-lg">
                    ✨ Generate Tags & Description
                </button>

                <div id="statusMessage" class="text-center text-xs text-slate-400"></div>

            </div>

        </div>
    </div>

    <div id="resultsArea" class="w-full max-w-4xl mx-auto mt-6 space-y-4"></div>

<script>

function generateTags(title, keywords) {
    const tagSet = new Set();

    const rawKeywords = keywords
        .split(",")
        .map(k => k.trim())
        .filter(Boolean);

    rawKeywords.forEach(k => tagSet.add(k));

    const titleWords = title
        .toLowerCase()
        .replace(/[^\w\s]/g, "")
        .split(/\s+/)
        .filter(w => w.length > 2);

    // Individual meaningful words from title
    titleWords.forEach(w => tagSet.add(w));

    // 2-word phrases from title
    for (let i = 0; i < titleWords.length - 1; i++) {
        tagSet.add(`${titleWords[i]} ${titleWords[i + 1]}`);
    }

    // Combine each keyword with common suffixes
    const suffixes = ["tutorial", "guide", "tips", "2026", "for beginners", "explained"];
    rawKeywords.forEach(k => {
        suffixes.forEach(suffix => {
            tagSet.add(`${k} ${suffix}`);
        });
    });

    // Keyword + title combos
    rawKeywords.forEach(k => {
        tagSet.add(`${k} ${title.toLowerCase()}`.slice(0, 60));
    });

    return Array.from(tagSet).slice(0, 30);
}

function generateDescription(title, keywords, channelName) {
    const rawKeywords = keywords
        .split(",")
        .map(k => k.trim())
        .filter(Boolean);

    const keywordLine = rawKeywords.length
        ? rawKeywords.join(", ")
        : "the topic covered in this video";

    const channelLine = channelName
        ? `\n\nDon't forget to subscribe to ${channelName} for more content like this!`
        : "\n\nDon't forget to subscribe for more content like this!";

    return `In this video, we cover "${title}".

You'll learn everything you need to know about ${keywordLine}, explained step by step so it's easy to follow along.

⏱ Timestamps:
0:00 Introduction
0:30 Main content
-- Add your own timestamps here --

🔔 Subscribe for more videos on ${rawKeywords[0] || "this topic"}.
👍 Like this video if it helped you, and drop a comment with your questions!${channelLine}

#${rawKeywords.map(k => k.replace(/\s+/g, "")).join(" #")}`;
}

function generateAll() {
    const title = document.getElementById("videoTitle").value.trim();
    const keywords = document.getElementById("keywords").value.trim();
    const channelName = document.getElementById("channelName").value.trim();
    const status = document.getElementById("statusMessage");
    const results = document.getElementById("resultsArea");

    if (!title) {
        status.innerHTML = '<span class="text-red-400">Please enter a video title.</span>';
        results.innerHTML = "";
        return;
    }

    const tags = generateTags(title, keywords);
    const description = generateDescription(title, keywords, channelName);

    status.innerHTML = '<span class="text-green-400">Generated successfully!</span>';

    results.innerHTML = `
        <div class="result-card p-5">
            <div class="flex justify-between items-center mb-3">
                <h2 class="text-white font-bold text-sm">🏷 Suggested Tags (${tags.length})</h2>
                <button onclick="copyText('tagsOutput', this)" class="text-xs bg-slate-800 hover:bg-slate-700 border border-slate-700 text-white px-3 py-1.5 rounded-lg">
                    📋 Copy All
                </button>
            </div>
            <div id="tagsDisplay">
                ${tags.map(t => `<span class="tag-pill">${escapeHtml(t)}</span>`).join("")}
            </div>
            <textarea id="tagsOutput" class="hidden">${escapeHtml(tags.join(", "))}</textarea>
        </div>

        <div class="result-card p-5">
            <div class="flex justify-between items-center mb-3">
                <h2 class="text-white font-bold text-sm">📝 Suggested Description</h2>
                <button onclick="copyText('descOutput', this)" class="text-xs bg-slate-800 hover:bg-slate-700 border border-slate-700 text-white px-3 py-1.5 rounded-lg">
                    📋 Copy
                </button>
            </div>
            <textarea id="descOutput" rows="12" class="w-full bg-[#0d1322] border border-slate-700 rounded-xl px-4 py-3 text-sm text-slate-200">${escapeHtml(description)}</textarea>
        </div>
    `;
}

function copyText(elementId, button) {
    const el = document.getElementById(elementId);
    el.classList.remove("hidden");
    el.select();
    document.execCommand("copy");
    if (elementId === "tagsOutput") el.classList.add("hidden");

    const originalText = button.textContent;
    button.textContent = "✅ Copied!";
    setTimeout(() => { button.textContent = originalText; }, 1500);
}

function escapeHtml(value) {
    const div = document.createElement("div");
    div.textContent = value;
    return div.innerHTML;
}

</script>

</body>
</html>
