<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Multi Viewer</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body {
            background: #0b0f19;
            color: #e2e8f0;
            font-family: system-ui, -apple-system, sans-serif;
        }

        .glow-border {
            background: linear-gradient(90deg, #ff0000, #3b82f6);
            padding: 2px;
            border-radius: 18px;
        }

        .custom-card { background: #121826; }

        .video-card {
            background: #121826;
            border: 1px solid #263247;
            border-radius: 16px;
            overflow: hidden;
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
        }

        .video-wrapper iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .slot-number { color: #ff4d4d; font-weight: 700; }

        #statusMessage { min-height: 20px; }

        textarea {
            resize: vertical;
        }
    </style>
</head>

<body class="min-h-screen p-4">

    <div class="glow-border w-full max-w-6xl mx-auto shadow-2xl">
        <div class="custom-card rounded-2xl p-6 md:p-8">

            <div class="flex justify-between items-center mb-6">
                <span class="bg-red-950/80 text-red-400 border border-red-800/50 text-xs font-bold px-4 py-2 rounded-full">
                    ● YouTube Engine 2026
                </span>
                <span class="bg-slate-800 text-cyan-400 text-xs font-semibold px-3 py-2 rounded-full border border-slate-700">
                    🏠 HELPVIEW
                </span>
            </div>

            <div class="text-center mb-8">
                <h1 class="text-3xl md:text-5xl font-extrabold text-white mb-3">
                    YouTube Multi-Viewer
                </h1>
                <p class="text-slate-400 text-sm max-w-2xl mx-auto">
                    Paste one YouTube URL or video ID per line to watch several
                    different videos side by side — great for comparing content,
                    monitoring multiple channels, or research.
                </p>
            </div>

            <div class="space-y-4">

                <textarea
                    id="videoUrls"
                    rows="4"
                    placeholder="Paste YouTube URLs or video IDs, one per line&#10;e.g.&#10;https://www.youtube.com/watch?v=dQw4w9WgXcQ&#10;https://youtu.be/9bZkp7q19f0"
                    class="w-full bg-[#0d1322] border border-slate-700 rounded-xl px-4 py-4 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-red-500"
                ></textarea>

                <div class="flex flex-wrap gap-3">

                    <select id="layoutStyle" class="bg-[#0d1322] border border-slate-700 rounded-xl px-4 py-3 text-sm text-white">
                        <option value="auto">Auto Layout</option>
                        <option value="1">1 Column</option>
                        <option value="2">2 Columns</option>
                        <option value="3">3 Columns</option>
                        <option value="4">4 Columns</option>
                    </select>

                    <button onclick="launchWorkspace()" class="flex-1 min-w-[200px] bg-gradient-to-r from-red-600 to-red-500 hover:from-red-700 hover:to-red-600 text-white font-bold px-6 py-3 rounded-xl shadow-lg">
                        ▶ Launch Workspace
                    </button>

                    <button onclick="clearAll()" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-white px-5 py-3 rounded-xl">
                        ✕ Clear
                    </button>

                </div>

                <div id="statusMessage" class="text-center text-xs text-slate-400"></div>

            </div>

        </div>
    </div>

    <div id="workspaceGrid" class="w-full max-w-[1800px] mx-auto mt-6 grid grid-cols-1 md:grid-cols-2 gap-4"></div>

<script>

function extractVideoId(line) {
    line = line.trim();
    if (!line) return null;

    const patterns = [
        /(?:youtube\.com\/watch\?v=|youtube\.com\/embed\/|youtube\.com\/shorts\/|youtu\.be\/)([a-zA-Z0-9_-]{11})/,
        /^([a-zA-Z0-9_-]{11})$/
    ];

    for (const pattern of patterns) {
        const match = line.match(pattern);
        if (match) return match[1];
    }

    return null;
}

function getColumns(count, layout) {
    if (layout !== "auto") return Number(layout);
    if (count === 1) return 1;
    if (count <= 4) return 2;
    if (count <= 9) return 3;
    return 4;
}

function launchWorkspace() {
    const raw = document.getElementById("videoUrls").value;
    const layout = document.getElementById("layoutStyle").value;
    const grid = document.getElementById("workspaceGrid");
    const status = document.getElementById("statusMessage");

    const lines = raw.split("\n").map(l => l.trim()).filter(Boolean);

    if (lines.length === 0) {
        status.innerHTML = '<span class="text-red-400">Please paste at least one YouTube URL or video ID.</span>';
        return;
    }

    const videoIds = [];
    const invalidLines = [];

    for (const line of lines) {
        const id = extractVideoId(line);
        if (id) {
            videoIds.push(id);
        } else {
            invalidLines.push(line);
        }
    }

    if (videoIds.length === 0) {
        status.innerHTML = '<span class="text-red-400">No valid YouTube URLs or video IDs found.</span>';
        return;
    }

    grid.innerHTML = "";

    const columns = getColumns(videoIds.length, layout);
    grid.style.gridTemplateColumns = `repeat(${columns}, minmax(0, 1fr))`;

    const fragment = document.createDocumentFragment();

    videoIds.forEach((id, index) => {
        const card = document.createElement("div");
        card.className = "video-card p-3 shadow-xl";

        card.innerHTML = `
            <div class="flex justify-between items-center mb-2">
                <span class="text-xs">
                    <span class="slot-number">Slot ${index + 1}</span>
                    <span class="text-slate-500">• ${escapeHtml(id)}</span>
                </span>
                <button onclick="removeSlot(this)" class="text-xs text-slate-500 hover:text-red-400">✕</button>
            </div>
            <div class="video-wrapper">
                <iframe
                    src="https://www.youtube.com/embed/${encodeURIComponent(id)}"
                    allowfullscreen
                    loading="lazy"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture">
                </iframe>
            </div>
        `;

        fragment.appendChild(card);
    });

    grid.appendChild(fragment);

    let statusText = `Loaded ${videoIds.length} video(s).`;
    if (invalidLines.length > 0) {
        statusText += ` Skipped ${invalidLines.length} line(s) that weren't valid YouTube links.`;
    }

    status.innerHTML = `<span class="text-green-400">${escapeHtml(statusText)}</span>`;
}

function removeSlot(button) {
    const card = button.closest(".video-card");
    if (card) card.remove();
}

function clearAll() {
    document.getElementById("videoUrls").value = "";
    document.getElementById("workspaceGrid").innerHTML = "";
    document.getElementById("statusMessage").innerHTML = "";
}

function escapeHtml(value) {
    const div = document.createElement("div");
    div.textContent = value;
    return div.innerHTML;
}

</script>

</body>
</html>
