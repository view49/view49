<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Script-to-Teleprompter Studio — View49</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }

    body {
      background: #08090d;
      color: #f4f4f5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 6%;
      background: rgba(8, 9, 13, 0.85);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo { font-size: 20px; font-weight: 800; color: #fff; text-decoration: none; display: flex; align-items: center; gap: 8px; }
    .logo span { color: #ff2d2d; }

    .studio-container {
      max-width: 1200px;
      margin: 30px auto;
      padding: 0 20px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
      width: 100%;
      flex: 1;
    }

    .card-panel {
      background: rgba(18, 20, 29, 0.7);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 24px;
      display: flex;
      flex-direction: column;
    }

    .panel-header {
      font-size: 18px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 12px; font-weight: 600; color: #a1a1aa; margin-bottom: 6px; }

    textarea, input[type="text"] {
      width: 100%;
      background: rgba(8, 9, 13, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 12px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }

    textarea { height: 220px; resize: none; line-height: 1.6; }

    .meta-bar {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: #ff2d2d;
      font-weight: 600;
      margin-top: 8px;
    }

    /* Teleprompter Viewport */
    .prompter-screen {
      background: #000;
      border: 2px solid rgba(255, 45, 45, 0.3);
      border-radius: 16px;
      height: 350px;
      overflow-y: auto;
      padding: 40px 20px;
      position: relative;
      scroll-behavior: smooth;
    }

    .prompter-text {
      font-size: 24px;
      font-weight: 700;
      color: #fff;
      text-align: center;
      line-height: 1.8;
      transition: font-size 0.2s;
    }

    .controls {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-top: 16px;
      flex-wrap: wrap;
    }

    .btn-action {
      background: linear-gradient(135deg, #ff2d2d 0%, #b91c1c 100%);
      color: #fff;
      border: none;
      padding: 12px 20px;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: 0.2s;
    }

    .btn-action:hover { opacity: 0.9; transform: translateY(-1px); }

    .slider-group {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #a1a1aa;
    }

    footer { text-align: center; padding: 20px; color: #52525b; font-size: 12px; }
  </style>
</head>
<body>

  <nav class="navbar">
    <a href="index.html" class="logo"><i class="fa-solid fa-bolt" style="color:#ff2d2d;"></i> View<span>49</span></a>
    <span style="font-size: 13px; color: #a1a1aa;">Teleprompter & Shorts Splitter Studio</span>
  </nav>

  <div class="studio-container">

    <div class="card-panel">
      <div class="panel-header"><i class="fa-solid fa-pen-nib" style="color:#ff2d2d;"></i> Script Editor</div>
      
      <div class="form-group">
        <label>Video Title / Topic</label>
        <input type="text" id="topicInput" value="3 Secret YouTube Growth Hacks in 2026" oninput="updateStats()">
      </div>

      <div class="form-group">
        <label>Script Content (Type or Paste)</label>
        <textarea id="scriptText" oninput="updateStats()">Kya aapko pata hai ki 2026 me Shorts viral karne ka sabse bada secret kya hai? 

First: Pehle 3 seconds me strong hook use karo. 
Second: Video ki pacing fast rakho. 
Third: Dynamic captions add karna mat bhoolna! 

Follow View49 for more creator tools!</textarea>
      </div>

      <div class="meta-bar">
        <span id="wordCount">Words: 0</span>
        <span id="estTime">Est. Duration: 0s (Shorts Ready)</span>
      </div>
    </div>

    <div class="card-panel">
      <div class="panel-header"><i class="fa-solid fa-display" style="color:#ff2d2d;"></i> Live Teleprompter</div>
      
      <div class="prompter-screen" id="prompterScreen">
        <div class="prompter-text" id="prompterText">Script loading...</div>
      </div>

      <div class="controls">
        <button class="btn-action" id="playBtn" onclick="togglePrompter()"><i class="fa-solid fa-play"></i> Start Prompting</button>
        
        <div class="slider-group">
          <label>Speed</label>
          <input type="range" id="speedSlider" min="1" max="10" value="3">
        </div>

        <div class="slider-group">
          <label>Font Size</label>
          <input type="range" id="fontSlider" min="18" max="40" value="24" oninput="changeFontSize(this.value)">
        </div>
      </div>
    </div>

  </div>

  <footer>&copy; 2026 View49 Creator Tools</footer>

  <script>
    let isScrolling = false;
    let scrollInterval = null;

    function updateStats() {
      const text = document.getElementById('scriptText').value;
      document.getElementById('prompterText').innerText = text || "Script editor me text likhein...";

      const words = text.trim().split(/\s+/).filter(w => w.length > 0).length;
      document.getElementById('wordCount').innerText = `Words: ${words}`;

      // Average reading speed: ~2.5 words per second
      const seconds = Math.ceil(words / 2.5);
      document.getElementById('estTime').innerText = `Est. Duration: ~${seconds}s ${seconds <= 60 ? '⚡ (Shorts Ready)' : '📹 (Long Video)'}`;
    }

    function changeFontSize(size) {
      document.getElementById('prompterText').style.fontSize = size + 'px';
    }

    function togglePrompter() {
      const screen = document.getElementById('prompterScreen');
      const btn = document.getElementById('playBtn');

      if (!isScrolling) {
        isScrolling = true;
        btn.innerHTML = `<i class="fa-solid fa-pause"></i> Pause`;
        
        const speed = 11 - document.getElementById('speedSlider').value;
        scrollInterval = setInterval(() => {
          screen.scrollTop += 2;
          if (screen.scrollTop + screen.clientHeight >= screen.scrollHeight) {
            togglePrompter();
          }
        }, speed * 5);
      } else {
        isScrolling = false;
        btn.innerHTML = `<i class="fa-solid fa-play"></i> Start Prompting`;
        clearInterval(scrollInterval);
      }
    }

    // Initial Stats Load
    updateStats();
  </script>
</body>
</html>
